<style>
:root{
  --bg:#f4f6fb; --bg2:#eaeefb; --card:#ffffff; --ink:#101828; --ink-soft:#5b6478;
  --line:#e3e8f2; --accent:#4f46e5; --accent-soft:#eef0ff;
  --ok:#12a26b; --ok-soft:#e8f8f1; --bad:#e5484d; --bad-soft:#fdecec;
  --shadow:0 10px 30px rgba(16,24,40,.08); --shadow-sm:0 2px 10px rgba(16,24,40,.06);
  --radius:20px; --topH:64px; --qbarH:0px;
}
[data-theme="dark"]{
  --bg:#0b1020; --bg2:#0f1730; --card:#141c33; --ink:#eef2ff; --ink-soft:#9aa6c4;
  --line:#243052; --accent:#7c8cff; --accent-soft:#1c2445;
  --ok:#3ddc97; --ok-soft:#10281f; --bad:#ff6b6b; --bad-soft:#2a1518;
  --shadow:0 12px 34px rgba(0,0,0,.45); --shadow-sm:0 2px 10px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}
body{
  touch-action:manipulation;
  font-family:"Segoe UI","Noto Naskh Arabic",Tahoma,"Helvetica Neue",Arial,sans-serif;
  background:linear-gradient(180deg,var(--bg),var(--bg2) 60%,var(--bg));
  color:var(--ink); min-height:100vh; min-height:100dvh;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
  overflow-x:hidden;
}
button{font-family:inherit;touch-action:manipulation}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}

/* ---------- top bar ---------- */
.top{
  position:sticky;top:0;z-index:40;backdrop-filter:blur(14px);
  padding-top:env(safe-area-inset-top);
  background:color-mix(in srgb, var(--bg) 82%, transparent);
  border-bottom:1px solid var(--line);
}
.top .inner{display:flex;align-items:center;gap:12px;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.2px}
.brand .logo{
  width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:19px;
  background:linear-gradient(135deg,#4f46e5,#8b5cf6);color:#fff;box-shadow:0 6px 16px rgba(79,70,229,.35)
}
.spacer{flex:1}
.icon-btn{
  border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;
  height:38px;min-width:38px;padding:0 12px;display:inline-flex;align-items:center;gap:7px;
  cursor:pointer;font-size:14px;font-weight:600;transition:.15s;box-shadow:var(--shadow-sm)
}
.icon-btn:hover{transform:translateY(-1px)}
.icon-btn.ghost{background:transparent;box-shadow:none}

/* ---------- hero ---------- */
.hero{padding:38px 0 10px;text-align:center}
.hero h1{font-size:clamp(24px,4.4vw,38px);margin:0 0 10px;letter-spacing:-.5px;line-height:1.3}
.hero p{margin:0 auto;max-width:640px;color:var(--ink-soft);font-size:16px;line-height:1.7}

/* ---------- homepage developer intro ---------- */
.hero-intro{
  display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,310px);
  align-items:center;gap:clamp(22px,5vw,58px);text-align:right;
  padding:28px 0 24px;min-height:300px
}
.hero-intro .hero-copy{min-width:0}
.hero-intro h1{font-size:clamp(27px,4.2vw,40px);margin:0 0 12px;letter-spacing:-.5px;line-height:1.35}
.hero-intro p{margin:0;max-width:650px;color:var(--ink-soft);font-size:16px;line-height:1.8}
.hero-intro .chips{justify-content:flex-start;margin-top:18px}
.hero-portrait{
  display:flex;align-items:flex-end;justify-content:center;align-self:stretch;
  min-height:260px;overflow:visible
}
.hero-portrait picture{display:block;width:100%;height:100%}
.hero-portrait img{
  display:block;width:100%;height:clamp(260px,31vw,360px);max-height:360px;
  object-fit:contain;object-position:center bottom
}
@media(max-width:680px){
  .hero-intro{grid-template-columns:1fr;gap:4px;text-align:center;padding:16px 0 20px}
  .hero-intro .hero-copy{order:2}
  .hero-intro .hero-portrait{order:1;min-height:0;height:270px;overflow:visible}
  .hero-intro .hero-portrait img{height:260px;max-height:260px}
  .hero-intro .hero-copy p{margin-inline:auto;font-size:14.5px}
  .hero-intro .chips{justify-content:center}
}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:18px}
.chip{
  background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 15px;
  font-size:13.5px;font-weight:700;color:var(--ink-soft);box-shadow:var(--shadow-sm)
}

/* ---------- cards ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin:26px 0 50px}
.course-card{
  position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px;cursor:pointer;transition:.2s;box-shadow:var(--shadow-sm);overflow:hidden;text-align:right
}
.course-card:before{
  content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:6px;background:var(--c,var(--accent))
}
.course-card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--c) 40%, var(--line))}
.cc-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.cc-emoji{
  width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:23px;
  background:color-mix(in srgb,var(--c) 14%, var(--card));border:1px solid color-mix(in srgb,var(--c) 26%, transparent)
}
.cc-title{font-weight:800;font-size:17px;line-height:1.4}
.cc-meta{color:var(--ink-soft);font-size:13px;margin-top:4px;font-weight:600;display:flex;flex-wrap:wrap;gap:0 6px;align-items:center}
.cc-meta .ccm{white-space:nowrap}
.cc-meta .ccm.sep{opacity:.45}
.cc-foot{display:flex;align-items:center;justify-content:space-between;margin-top:16px;gap:10px}
.badge{
  font-size:12.5px;font-weight:800;padding:6px 11px;border-radius:999px;
  background:var(--accent-soft);color:var(--accent)
}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.go{
  font-size:13.5px;font-weight:800;color:var(--c,var(--accent));display:inline-flex;align-items:center;gap:6px
}

/* ---------- setup ---------- */
.setup{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);margin:22px 0 26px}
.setup h2{margin:0 0 4px;font-size:19px}
.setup .sub{color:var(--ink-soft);font-size:13.5px;margin-bottom:18px}
.label{font-size:13px;font-weight:800;color:var(--ink-soft);margin:16px 0 9px}
.seg{display:flex;flex-wrap:wrap;gap:9px}
.seg button{
  border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;
  padding:10px 15px;cursor:pointer;font-weight:700;font-size:14px;transition:.15s
}
.seg button.sel{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.modecards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:620px){.modecards{grid-template-columns:1fr}}
.modecard{
  border:1.5px solid var(--line);border-radius:15px;padding:15px;cursor:pointer;background:var(--card);
  display:flex;gap:12px;align-items:flex-start;transition:.15s;text-align:right
}
.modecard.sel{border-color:var(--accent);background:var(--accent-soft)}
.modecard .mi{font-size:22px}
.modecard b{display:block;font-size:15px;margin-bottom:3px}
.modecard span{color:var(--ink-soft);font-size:12.8px;line-height:1.6}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.switch{display:inline-flex;align-items:center;gap:9px;cursor:pointer;font-size:14px;font-weight:700;user-select:none}
.switch input{display:none}
.track{width:44px;height:25px;border-radius:999px;background:var(--line);position:relative;transition:.2s}
.track:after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.switch input:checked + .track{background:var(--accent)}
.switch input:checked + .track:after{inset-inline-start:22px}
.exam-settings{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-top:16px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--bg2)}
.exam-setting{display:flex;flex-direction:column;gap:6px;min-width:150px}
.exam-setting label{font-size:12.5px;font-weight:800;color:var(--ink-soft)}
.exam-setting select,.exam-setting input{min-height:40px;min-width:120px;border:1px solid var(--line);border-radius:10px;padding:8px 11px;background:var(--card);color:var(--ink);font:inherit;font-size:14px}
.exam-setting input:disabled{opacity:.5}
.q-source{display:block;margin-top:4px;font-size:11.5px;font-weight:700;color:var(--ink-soft)}
.pill.timer{color:var(--accent);font-variant-numeric:tabular-nums;direction:ltr}
.primary{
  border:none;border-radius:14px;padding:15px 26px;font-weight:800;font-size:16px;cursor:pointer;
  background:linear-gradient(135deg,var(--accent),#8b5cf6);color:#fff;box-shadow:0 10px 24px rgba(79,70,229,.32);
  transition:.15s
}
.primary:hover{transform:translateY(-2px)}
.primary:disabled{opacity:.5;cursor:not-allowed;transform:none}

/* ---------- quiz ---------- */
.qbar{
  position:sticky;top:var(--topH);z-index:30;background:color-mix(in srgb,var(--bg) 88%, transparent);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:11px 0
}
.qbar .inner{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.progress{flex:1;height:9px;background:var(--line);border-radius:99px;overflow:hidden;min-width:120px}
.progress i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--accent),#22d3ee);transition:width .3s}
.counters{display:flex;gap:8px;font-size:13px;font-weight:800}
.pill{padding:5px 11px;border-radius:99px;background:var(--card);border:1px solid var(--line)}
.pill.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 30%,var(--line))}
.pill.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 30%,var(--line))}

.qlist{display:flex;flex-direction:column;gap:16px;padding:20px 0 90px}
.q{
  background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 18px 14px;
  box-shadow:var(--shadow-sm);scroll-margin-top:calc(var(--topH) + var(--qbarH) + 12px)
}
.q-head{display:flex;gap:11px;align-items:flex-start;margin-bottom:14px}
.qnum{
  flex:0 0 auto;min-width:32px;height:32px;padding:0 8px;border-radius:10px;display:grid;place-items:center;
  background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:14px
}
.qtext{font-size:16.5px;font-weight:700;line-height:1.75;flex:1}
.qfig{margin:6px 0 14px;text-align:center}
.qfig img{max-width:100%;max-height:330px;border-radius:12px;border:1px solid var(--line);background:#fff;padding:6px;cursor:zoom-in}
.zoombar{display:block;font-size:11.5px;color:var(--ink-soft);font-weight:700;margin-top:4px}
.lightbox{position:fixed;inset:0;z-index:80;background:rgba(8,12,26,.9);display:flex;align-items:center;
  justify-content:center;padding:14px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:92vh;border-radius:10px;background:#fff;padding:8px}
.lightbox .lb-x{position:absolute;top:calc(10px + env(safe-area-inset-top));inset-inline-end:14px;width:40px;height:40px;
  border-radius:50%;border:none;background:#fff;color:#111;font-size:20px;font-weight:800;cursor:pointer}
.opts{display:flex;flex-direction:column;gap:9px}
/* ---------- accessibility: visible focus + motion ---------- */
:where(a,button,input,select,label).focus-visible{
  outline:3px solid var(--accent);outline-offset:2px;border-radius:10px
}
.opt:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.sr-only{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;
    transition-duration:.001ms !important;scroll-behavior:auto !important}
}

.opt{
  display:grid;grid-template-columns:28px 1fr 20px;align-items:center;gap:11px;border:1.5px solid var(--line);background:var(--card);
  border-radius:13px;padding:12px 14px;cursor:pointer;text-align:right;font-size:15px;line-height:1.6;
  transition:.12s;width:100%;color:var(--ink)
}
.opt:hover:not(.locked){border-color:var(--accent);background:var(--accent-soft)}
.opt .k{
  width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-weight:800;
  font-size:13px;background:var(--bg2);color:var(--ink-soft);border:1px solid var(--line)
}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .k{background:var(--ok);color:#fff;border-color:transparent}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:#fff;border-color:transparent}
.opt.locked{cursor:default}
.opt .mark{font-weight:900;text-align:center;font-size:15px}
.feedback{
  margin-top:12px;border-radius:12px;padding:11px 14px;font-size:14px;font-weight:700;line-height:1.7;
  display:none
}
.feedback.show{display:block}
.feedback.ok{background:var(--ok-soft);color:var(--ok)}
.feedback.bad{background:var(--bad-soft);color:var(--bad)}
.q-actions{display:flex;gap:9px;margin-top:11px;flex-wrap:wrap}
.mini{
  border:1px solid var(--line);background:transparent;color:var(--ink-soft);border-radius:10px;
  padding:7px 12px;font-size:12.8px;font-weight:700;cursor:pointer
}
.mini:hover{color:var(--accent);border-color:var(--accent)}

/* exam nav */
.exam-card{padding:22px 0 24px}
.nav{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:20px;flex-wrap:wrap}
.jump{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
.jump button{
  width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--card);
  color:var(--ink-soft);font-weight:800;font-size:12.5px;cursor:pointer
}
.jump button.done{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.jump button.cur{outline:2px solid var(--accent);outline-offset:1px}

/* result */
.result{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:26px;box-shadow:var(--shadow);margin:24px 0}
.ring{
  width:150px;height:150px;border-radius:50%;display:grid;place-items:center;margin:0 auto 16px;position:relative;
  background:conic-gradient(var(--rc) calc(var(--p)*1%), var(--line) 0)
}
.ring:before{content:"";position:absolute;inset:11px;border-radius:50%;background:var(--card)}
.ring div{position:relative;text-align:center}
.ring b{font-size:32px;display:block;line-height:1}
.ring span{font-size:12.5px;color:var(--ink-soft);font-weight:700}
.rtitle{text-align:center;font-size:21px;font-weight:800;margin:0 0 6px}
.rsub{text-align:center;color:var(--ink-soft);font-size:14px;margin-bottom:20px}
.rstats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0 auto 22px;max-width:520px}
.rstat{background:var(--bg2);border-radius:14px;padding:14px;text-align:center}
.rstat b{display:block;font-size:22px}
.rstat span{font-size:12.5px;color:var(--ink-soft);font-weight:700}
/* The toast is dark in light mode and light in dark mode. Using --ink here
   would flip to near-white in dark mode and make the white text invisible. */
.pwa-toast{
  position:fixed;left:50%;bottom:18px;transform:translate(-50%,140%);z-index:90;
  display:flex;align-items:center;gap:12px;max-width:min(560px,calc(100vw - 28px));
  background:#16203a;color:#fff;border:1px solid rgba(255,255,255,.12);
  border-radius:14px;padding:13px 16px;
  box-shadow:0 12px 34px rgba(16,24,40,.28);transition:transform .28s ease;
  font-size:13.5px;font-weight:700;line-height:1.5
}
[data-theme="dark"] .pwa-toast{
  background:#eef2ff;color:#101a33;border-color:rgba(16,26,51,.12);
  box-shadow:0 12px 24px rgba(0,0,0,.55)
}
.pwa-toast.show{transform:translate(-50%,0)}
.pwa-msg{flex:1;min-width:0;overflow-wrap:anywhere}
.pwa-act{
  border:0;background:var(--accent);color:#fff;font-family:inherit;font-weight:800;font-size:13px;
  padding:9px 15px;border-radius:10px;cursor:pointer;white-space:nowrap;flex-shrink:0
}
.pwa-act:hover{filter:brightness(1.1)}
/* The dark-mode accent (#7c8cff) only reaches 3:1 against white text, so the
   button gets an explicit dark label instead. */
[data-theme="dark"] .pwa-act{background:#4f46e5;color:#fff}
@media (prefers-reduced-motion: reduce){ .pwa-toast{transition:none} }
.qsearch{position:relative;display:flex;align-items:center;gap:9px;border:1.5px solid var(--line);
  background:var(--card);border-radius:13px;padding:0 13px;transition:.15s}
.qsearch:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.qsearch-ic{display:inline-flex;color:var(--ink-soft);flex-shrink:0}
.qsearch input{flex:1;border:0;background:transparent;outline:none;font-family:inherit;font-size:14.5px;
  color:var(--ink);padding:13px 0;min-width:0}
.qsearch input::placeholder{color:var(--ink-soft);opacity:.75}
.qsearch input::-webkit-search-cancel-button{display:none}
.qsearch-x{border:0;background:var(--bg2);color:var(--ink-soft);width:26px;height:26px;border-radius:50%;
  cursor:pointer;font-size:13px;line-height:1;display:grid;place-items:center;flex-shrink:0;font-family:inherit}
.qsearch-x:hover{background:var(--bad-soft);color:var(--bad)}

.srch-head{font-size:13px;color:var(--ink-soft);margin:12px 0 10px;display:flex;align-items:center;
  gap:7px;flex-wrap:wrap;font-weight:700}
.srch-head b{color:var(--ink);font-size:13.5px}
.srch-cap{opacity:.8}
.srch-time{margin-inline-start:auto;font-size:11px;background:var(--bg2);padding:3px 8px;border-radius:99px;

const EMO = {ethics: IC.scale, invest: IC.chart, acct: IC.calc, prog: IC.code, macro: IC.book, gov: IC.bank};

const FIGS = __FIGS__;

/* ---------- helpers ---------- */
const $ = (s, el=document) => el.querySelector(s);
const app = $('#app');

/* Escape untrusted text before it is interpolated into an innerHTML template.
   Every string that comes from data.json (stem, options, notes, course and
   section titles) must pass through here. Keep this as the single choke point
   so a future edit cannot accidentally reintroduce raw interpolation. */
const ESC_MAP = { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' };
function esc(value){
  if (value === null || value === undefined) return '';
  return String(value).replace(/[&<>"']/g, ch => ESC_MAP[ch]);
}
const LETTERS = ['أ','ب','ج','د','هـ'];
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d }catch(e){ return d } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)) }catch(e){} }
};

const SKEY = 'qb.session';
/* ------------------------------------------------------------------ *
 * Attempt history
 *
 * Separate from the mistake log on purpose (see ROADMAP §3.3):
 *   - qb.review.v1  = "which questions still need revision" (small, pruned)
 *   - qb.history.v1 = "everything the student has ever answered" (audit trail)
 * The history is the source of truth for analytics. It is capped per session
 * and trimmed by age + count so localStorage cannot grow without bound.
 * ------------------------------------------------------------------ */
const HKEY = 'qb.history.v1';
const HISTORY_MAX_ENTRIES = 5000;      // hard cap on stored attempts
const HISTORY_MAX_AGE_DAYS = 400;      // older attempts are dropped
const SESSION_MAX_ATTEMPTS = 5000;     // safety valve for one giant session

function emptyHistory(){
  return {v:1, attempts:[], sessions:[], streak:{current:0,best:0,lastDay:null}};
}
function loadHistory(){
  const raw = store.get(HKEY, null);
  if (!raw || typeof raw !== 'object') return emptyHistory();
  if (!Array.isArray(raw.attempts)) raw.attempts = [];
  if (!Array.isArray(raw.sessions)) raw.sessions = [];
  if (!raw.streak || typeof raw.streak !== 'object') raw.streak = {current:0,best:0,lastDay:null};
  return raw;
}
function saveHistory(h){ store.set(HKEY, h); }

function dayKey(ts){
  const d = new Date(ts);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function dayDiff(a, b){
  /* whole days between two YYYY-MM-DD keys, ignoring time of day */
  const pa = a.split('-').map(Number), pb = b.split('-').map(Number);
  const ta = Date.UTC(pa[0], pa[1]-1, pa[2]), tb = Date.UTC(pb[0], pb[1]-1, pb[2]);
  return Math.round((tb - ta) / 86400000);
}

/* Answer codes: an integer >= 0 is the chosen option; -1 means "revealed". */
function recordHistoryAttempt(q, answer, course){
  if (!q || !q.id) return;
  const h = loadHistory();
  const now = Date.now();
  const outcome = answer === -1 ? 'revealed' : (answer === q.ans ? 'correct' : 'wrong');

  h.attempts.push({
    id: q.id,
    t: now,
    o: outcome,
    a: Number.isInteger(answer) ? answer : -1,
    c: q.courseId || course?.id || '',
    s: q.sectionId || '',
  });

  /* ---- streak: one increment per calendar day with activity ---- */
  const today = dayKey(now);
  const st = h.streak;
  if (st.lastDay !== today){
    st.current = st.lastDay && dayDiff(st.lastDay, today) === 1 ? (st.current || 0) + 1 : 1;
    st.lastDay = today;
    st.best = Math.max(st.best || 0, st.current);
  }

  pruneHistory(h, now);
  saveHistory(h);
}

/* A "session" is one quiz run. Opened when a quiz starts, closed on finish. */
function openHistorySession(meta){
  const h = loadHistory();
  h.sessions.push(Object.assign({
    id: 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
    start: Date.now(),
    end: null,
    mode: 'study',
    courseId: '',
    courseTitle: '',
    isReview: false,
    total: 0,
    answered: 0,
    correct: 0,
    wrong: 0,
    revealed: 0,
    timedOut: false,
  }, meta));
  pruneHistory(h, Date.now());
  saveHistory(h);
  return h.sessions[h.sessions.length - 1].id;
}
function updateHistorySession(){
  if (!state.sessionId) return;
  const h = loadHistory();
  const rec = h.sessions.find(x => x.id === state.sessionId);
  if (!rec) return;
  const total = state.quiz.length;
  let correct = 0, wrong = 0, revealed = 0, answered = 0;
  state.quiz.forEach((q, i) => {
    const a = state.answers[i];
    if (a === undefined) return;
    answered++;
    if (a === -1) revealed++;
    else if (a === q.ans) correct++;
    else wrong++;
  });
  rec.answered = answered; rec.correct = correct;
  rec.wrong = wrong; rec.revealed = revealed; rec.total = total;
  saveHistory(h);
}
function closeHistorySession(finished){
  if (!state.sessionId) return;
  updateHistorySession();
  const h = loadHistory();
  const rec = h.sessions.find(x => x.id === state.sessionId);
  if (rec){
    rec.finished = !!finished;
    if (finished){
      rec.end = Date.now();
      rec.timedOut = !!state.timeExpired;
      rec.pct = rec.total ? Math.round(rec.correct / rec.total * 100) : 0;
    }
  }
  saveHistory(h);
}

function pruneHistory(h, now){
  const cutoff = now - HISTORY_MAX_AGE_DAYS * 86400000;
  if (h.attempts.length > HISTORY_MAX_ENTRIES){
    h.attempts = h.attempts.slice(-HISTORY_MAX_ENTRIES);
  }
  if (h.sessions.length > 400) h.sessions = h.sessions.slice(-400);
  /* age trim is cheap enough to do inline: keep it O(n) with a single filter */
  if (h.attempts.length && h.attempts[0].t < cutoff){
    h.attempts = h.attempts.filter(a => a.t >= cutoff);
  }
}

const RKEY = 'qb.review.v1';   // legacy mistake log -- read-only, migrated on load
const MKEY = 'qb.mastery.v1';  // mastery model (replaces the legacy log)

/* ------------------------------------------------------------------ *
 * Spaced repetition / mastery model  (ROADMAP §3.1)
 *
 * Replaces the old "drop the question after two correct answers" rule with a
 * graded level per question. The level decides when the question is due again:
 *
 *   level 0  just missed ............ due immediately
 *   level 1  answered once ......... +1 day
 *   level 2  twice in a row ........ +3 days
 *   level 3  solid ................. +1 week
 *   level 4  stable ................ +2 weeks
 *   level 5+ mastered .............. +4 weeks (kept out of the queue)
 *
 * A wrong answer knocks the level back to 0, so a "mastered" question that
 * starts failing returns to practice immediately. Levels are deliberately
 * capped so no question can be parked forever on the strength of one good day.
 * ------------------------------------------------------------------ */
const MASTERY_INTERVALS = [0, 1, 3, 7, 14, 28];   // days, indexed by level
const MASTERY_MAX_LEVEL = MASTERY_INTERVALS.length - 1;
/* Level 5 means "stable", NOT "finished". A question at the top still comes
 * back every MASTERY_INTERVALS[5] days (28) — that is the whole point of the
 * schedule: memory needs refreshing even once it is solid. Only a question
 * that no longer exists in the bank leaves the queue. */
const MASTERY_STABLE = MASTERY_MAX_LEVEL;          // level 5 reached
const MASTERY_MASTERED = MASTERY_STABLE;           // kept for older call sites

function emptyMastery(){ return { v:1, items:{} }; }

function loadMastery(){
  const raw = store.get(MKEY, null);
  if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return migrateLegacyReview();
  if (!raw.items || typeof raw.items !== 'object' || Array.isArray(raw.items)) raw.items = {};
  return raw;
}

/* One-time conversion of the old mistake log so nobody loses their queue. */
function migrateLegacyReview(){
  const legacy = store.get(RKEY, null);
  const m = emptyMastery();
  if (legacy && typeof legacy === 'object' && !Array.isArray(legacy)){
    const now = Date.now();
    for (const [id, rec] of Object.entries(legacy)){
      if (!rec || typeof rec !== 'object') continue;
      m.items[id] = {
        id,
        level: 0,
        wrong: rec.wrongCount || 0,
        correct: rec.correctCount || 0,
        streak: rec.correctStreak || 0,
        due: now,                        // everything from the old log is due now
        last: rec.lastAttemptAt || now,
        courseId: rec.courseId || '',
        courseTitle: rec.courseTitle || '',
        firstWrongAt: rec.firstWrongAt || now,
      };
    }
    /* keep the legacy key intact for one release as a safety net */
  }
  store.set(MKEY, m);
  return m;
}

function masteryFor(m, id){
  return m.items[id] || null;
}

/* Fold one answer into the mastery model. */
function updateMastery(it, answer, now){
  const m = loadMastery();
  const correct = answer !== -1 && answer === it.ans;
  const revealed = answer === -1;
  const rec = m.items[it.id] || {
    id: it.id, level: 0, wrong: 0, correct: 0, streak: 0,
    due: now, last: now, courseId: it.courseId, courseTitle: it.courseTitle,
    firstWrongAt: null,
  };

  rec.courseId = rec.courseId || it.courseId || '';
  rec.courseTitle = rec.courseTitle || it.courseTitle || '';
  rec.last = now;

  if (correct){
    rec.correct++;
    rec.streak++;
    /* Only a real answer promotes. Revealing the answer is not mastery. */
    rec.level = Math.min(MASTERY_MAX_LEVEL, (rec.level || 0) + 1);
  } else {
    rec.wrong++;
    rec.streak = 0;
    rec.level = 0;
    rec.firstWrongAt = rec.firstWrongAt || now;
    /* A revealed question counts as "not learned yet" but is not punished
       as hard as a wrong answer: it stays due immediately either way. */
    if (revealed) rec.revealed = (rec.revealed || 0) + 1;
  }

  rec.due = now + MASTERY_INTERVALS[rec.level] * 86400000;
  m.items[it.id] = rec;
  store.set(MKEY, m);
  return rec;
}

/* Counts only questions that still exist in the bank, so the number shown on
   the home screen always matches what dueQuestions() will actually serve. */
function dueCount(now){
  const m = loadMastery();
  let n = 0;
  for (const rec of Object.values(m.items)){
    /* No level filter: a level-5 question is still scheduled (every 28 days),
       so it must still be counted when its date comes round. */
    if ((rec.due || 0) > now) continue;
    if (!ITEMS[rec.id]) continue;                  // question left the bank
    n++;
  }
  return n;
}

/* Due questions, most overdue first. Level 5 is included: it comes back
 * every 28 days, which is what the interval table promises. */
function dueQuestions(now){
  const m = loadMastery();
  const out = [];
  for (const rec of Object.values(m.items)){
    if ((rec.due || 0) > now) continue;
    const it = ITEMS[rec.id];
    if (!it) continue;                       // question removed from the bank
    out.push({ rec, it });
  }
  out.sort((a, b) => (a.rec.due || 0) - (b.rec.due || 0) || (a.rec.level || 0) - (b.rec.level || 0));
  return out;
}

/* Counts used by the home panel and the analytics screen. */
function masterySummary(now){
  const m = loadMastery();
  const s = {tracked:0, due:0, mastered:0, byLevel:[0,0,0,0,0,0]};
  for (const rec of Object.values(m.items)){
    s.tracked++;
    const lvl = Math.min(MASTERY_MAX_LEVEL, Math.max(0, rec.level || 0));
    s.byLevel[lvl]++;
    if (rec.level >= MASTERY_STABLE) s.mastered++;
    /* `due` must agree with dueCount(), which no longer excludes level 5. */
    if ((rec.due || 0) <= now && ITEMS[rec.id]) s.due++;
  }
  return s;
}

/* "بعد 3 أيام" / "بعد ساعتين" for the next scheduled review. */
function nextDueIn(){
  const m = loadMastery();
  const now = Date.now();
  let soonest = Infinity;
  for (const rec of Object.values(m.items)){
    /* Level 5 included: it still has a date (28 days out). */
    if ((rec.due || 0) > now && rec.due < soonest && ITEMS[rec.id]) soonest = rec.due;
  }
  if (!isFinite(soonest)) return '';
  const ms = soonest - now;
  const days = Math.ceil(ms / 86400000);
  if (days >= 2) return days + ' أيام';
  const hours = Math.ceil(ms / 3600000);
  if (hours >= 2) return hours + ' ساعة';
  return 'ساعة';
}

/* Small distribution bars shown under the review panel. */
function masteryBars(m){
  const labels = ['مبتدئ', 'يتحسن', 'جيد', 'متقن جزئيًا', 'متقن', 'مستقر'];
  const max = Math.max(1, ...m.byLevel);
  const rows = m.byLevel.map((n, i) => {
    const cls = i >= MASTERY_MASTERED ? 'var(--ok)' : i === 0 ? 'var(--bad)' : i <= 2 ? '#f59e0b' : 'var(--accent)';
    return `<div class="lv-row">
      <span class="lv-lbl">${labels[i]}</span>
      <div class="lv-track"><i style="width:${Math.round(n/max*100)}%;background:${cls}"></i></div>
      <span class="lv-n">${n}</span>
    </div>`;
  }).join('');
  return `<div class="lv-wrap">
    <div class="lv-head">مستويات الإتقان — ${m.tracked} سؤال متتبَّع${m.mastered ? `، ${m.mastered} وصل للمستوى المستقر` : ''}</div>
    ${rows}
  </div>`;
}

function daysUntil(ts, now){
  return Math.max(0, Math.ceil((ts - now) / 86400000));
}

/* Single funnel for every answer the student gives.
   Order matters: the audit trail is written first so a later failure can never
   lose the attempt, then the mastery model, then the live session counters. */
function recordAttempt(q, answer, course){
  if (!q || !q.id) return;
  const now = Date.now();
  recordHistoryAttempt(q, answer, course);
  updateHistorySession();
  updateMastery(q, answer, now);
}

/* Kept for the home screen and the review button: how many questions are due. */
function getReviewCount(){ return dueCount(Date.now()); }

/* ------------------------------------------------------------------ *
 * Analytics -- everything here is derived from the attempt history, so the
 * numbers always match what the student actually did.
 * ------------------------------------------------------------------ */
function computeAnalytics(){
  const h = loadHistory();
  const stats = {
    total: 0, correct: 0, wrong: 0, revealed: 0,
    byCourse: {}, bySection: {}, byDay: {},
    firstAt: null, lastAt: null, streak: h.streak || {current:0,best:0},
    uniqueQuestions: new Set(),
    sessions: h.sessions.length,
  };
  for (const a of h.attempts){
    stats.total++;
    if (a.o === 'correct') stats.correct++;
    else if (a.o === 'wrong') stats.wrong++;
    else stats.revealed++;
    stats.uniqueQuestions.add(a.id);
    if (!stats.firstAt || a.t < stats.firstAt) stats.firstAt = a.t;
    if (!stats.lastAt || a.t > stats.lastAt) stats.lastAt = a.t;

    const courseKey = a.c || 'unknown';
    if (!stats.byCourse[courseKey]) stats.byCourse[courseKey] = {total:0, correct:0, wrong:0, revealed:0};
    const bc = stats.byCourse[courseKey];
    bc.total++; bc[a.o]++;

    if (a.s){
      const secKey = courseKey + '/' + a.s;
      if (!stats.bySection[secKey]) stats.bySection[secKey] = {total:0, correct:0, wrong:0, revealed:0};
      const bs = stats.bySection[secKey];
      bs.total++; bs[a.o]++;
    }

    const day = dayKey(a.t);
    if (!stats.byDay[day]) stats.byDay[day] = {total:0, correct:0};
    stats.byDay[day].total++;
    if (a.o === 'correct') stats.byDay[day].correct++;
  }
  stats.uniqueCount = stats.uniqueQuestions.size;
  stats.accuracy = stats.total ? Math.round(stats.correct / stats.total * 100) : 0;
  return stats;
}

function accuracyOf(bucket){
  return bucket && bucket.total ? Math.round(bucket.correct / bucket.total * 100) : 0;
}

/* Sections ranked worst-first, but only where there is a meaningful sample. */
function weakSections(stats, minAttempts = 3){
  return Object.entries(stats.bySection)
    .map(([key, b]) => {
      const [courseId, sectionId] = key.split('/');
      const meta = sectionMeta(courseId, sectionId);
      return {courseId, sectionId, title: meta.sectionTitle, course: meta.courseTitle,
              ...b, accuracy: accuracyOf(b)};
    })
    .filter(x => x.total >= minAttempts)
    .sort((a, b) => a.accuracy - b.accuracy || b.total - a.total);
}

function sectionMeta(courseId, sectionId){
  const course = DATA.find(c => c.id === courseId);
  const section = course?.sections.find(x => x.id === sectionId);
  return {courseTitle: course?.title || courseId, sectionTitle: section?.title || sectionId};
}

/* Last `days` calendar days, oldest first, for the activity chart. */
function recentDays(n){
  const out = [];
  const now = Date.now();
  for (let i = n - 1; i >= 0; i--){
    out.push(dayKey(now - i * 86400000));
  }
  return out;
}

/* Questions answered wrong most often in the history. */
function hardestQuestions(limit = 10){
  const h = loadHistory();
  const agg = new Map();
  for (const a of h.attempts){
    if (!agg.has(a.id)) agg.set(a.id, {id:a.id, wrong:0, correct:0, revealed:0, last:0});
    const row = agg.get(a.id);
    if (a.o === 'wrong') row.wrong++;
    else if (a.o === 'correct') row.correct++;
    else row.revealed++;
    row.last = Math.max(row.last, a.t);
  }
  return [...agg.values()]
    .filter(r => (r.wrong + r.revealed) > 0 && ITEMS[r.id])
    .sort((a, b) => (b.wrong + b.revealed) - (a.wrong + a.revealed) || b.last - a.last)
    .slice(0, limit)
    .map(r => Object.assign(r, {item: ITEMS[r.id]}));
}

/* Items the student has never answered at all, newest-first is meaningless
   here -- we just need the count and a sample for the "keep going" nudge. */
function unansweredQuestions(){
  const h = loadHistory();
  const seen = new Set(h.attempts.map(a => a.id));
  const out = [];
  DATA.forEach(c => c.sections.forEach(s => s.items.forEach(it => {
    if (!seen.has(it.id)) out.push(Object.assign({_course:c, _section:s}, it));
  })));
  return out;
}

/* ------------------------------------------------------------------ *
 * In-course search
 *
 * Scope is deliberately narrow: search only ever looks inside the course the
 * student is currently viewing. There is no global cross-course search -- the
 * question bank covers eight unrelated subjects, so a global hit list would mix
 * results the student cannot act on together.
 *
 * Matching is diacritic- and hamza-insensitive: Arabic text extracted from the
 * source PDFs varies between أ/ا/إ and drops or adds تشكيل, so a literal match
 * would miss most real queries.
 * ------------------------------------------------------------------ */
const AR_DIACRITICS = /[\u064B-\u0652\u0670\u0640]/g;   // تشكيل + تطويل
const AR_NORMALISE = {
  'أ':'ا', 'إ':'ا', 'آ':'ا', 'ٱ':'ا',
  'ى':'ي', 'ئ':'ي', 'ؤ':'و',
  'ة':'ه',
};
function normaliseArabic(text){
  return String(text || '')
    .toLowerCase()
    .replace(AR_DIACRITICS, '')
    .replace(/[أإآٱىئةؤ]/g, ch => AR_NORMALISE[ch] || ch)
    .replace(/\s+/g, ' ')
    .trim();
}

/* Every query token must appear somewhere in the question (AND semantics).
   Returns null when the question does not match, or a small object describing
   where the hits landed so the UI can highlight/rank them. */
function matchQuestion(item, tokens){
  const hay = {
    q: normaliseArabic(item.q),
    note: normaliseArabic(item.note),
    opts: item.opts.map(normaliseArabic),
  };
  let score = 0;
  for (const t of tokens){
    const inStem = hay.q.includes(t);
    const inOpt = hay.opts.some(o => o.includes(t));
    const inNote = hay.note.includes(t);
    if (!inStem && !inOpt && !inNote) return null;
    if (inStem) score += 3;
    else if (inOpt) score += 2;
    else score += 1;
  }
  return {score, inNote: tokens.every(t => hay.note.includes(t))};
}

/* Search one course's questions. `course` is the only scope -- by construction
   there is no way to ask this function for results from another course. */
function searchCourse(course, query){
  const tokens = normaliseArabic(query).split(' ').filter(Boolean);
  if (!course || !tokens.length) return [];
  const hits = [];
  for (const section of course.sections){
    for (const item of section.items){
      const m = matchQuestion(item, tokens);
      if (!m) continue;
      hits.push({item, section, score: m.score});
    }
  }
  hits.sort((a, b) => b.score - a.score);
  return hits;
}

function saveExamPrefs(){
  store.set('qb.examSettings', {count:state.examCount, timerEnabled:state.timerEnabled, timerMinutes:state.timerMinutes});
}
function saveSession(){
  if (state.view !== 'quiz' && state.view !== 'result') { try{localStorage.removeItem(SKEY)}catch(e){} return }
  store.set(SKEY, {courseId: state.course.id, mode: state.mode, quiz: state.quiz,
                   answers: state.answers, idx: state.idx, view: state.view,
                   isReview:state.isReview, deadline:state.deadline,
                   examRecorded:state.examRecorded, timeExpired:state.timeExpired});
}
function loadSession(){ return store.get(SKEY, null) }
function validSession(s){
  if (!s || !s.courseId || !Array.isArray(s.quiz) || !s.quiz.length) return false;
  if (s.courseId === '__review' ? !s.isReview : !DATA.find(c=>c.id===s.courseId)) return false;
  return s.quiz.every(q => q && typeof q.q === 'string' && Array.isArray(q.opts) && q.opts.length >= 2
                           && Number.isInteger(q.ans) && q.ans >= 0 && q.ans < q.opts.length);
}
function resumeSession(){
  const s = loadSession(); if (!validSession(s)) { dropSession(); renderHome(); return; }
  state.isReview = !!s.isReview;
  state.course = state.isReview
    ? {id:'__review',title:'مراجعة الأخطاء',color:'var(--accent)',sections:[]}
    : DATA.find(c=>c.id===s.courseId);
  state.mode = s.mode === 'exam' ? 'exam' : 'study';
  state.quiz = s.quiz.map(q=>{
    const match = q.id ? null : DATA.find(c=>c.id===(q.courseId||s.courseId))?.sections
      .flatMap(sec=>sec.items).find(item=>item.q===q.q && item.ans===q.ans);
    return {...q, id:q.id || match?.id, courseId:q.courseId || match?.courseId || s.courseId,
            courseTitle:q.courseTitle || match?.courseTitle || state.course.title};
  });
  state.answers = s.answers || {};
  state.idx = Math.min(Math.max(0, s.idx || 0), s.quiz.length - 1);
  state.deadline = Number.isFinite(s.deadline) ? s.deadline : null;
  state.examRecorded = !!s.examRecorded;
  state.timeExpired = !!s.timeExpired;
  state.view = s.view === 'result' ? 'result' : 'quiz';
  render(); window.scrollTo(0,0);
}
function dropSession(){ try{localStorage.removeItem(SKEY)}catch(e){} }

/* normalise every question into {q, opts:[], ans:int, fig} */
DATA.forEach(c => c.sections.forEach(s => {
  s.items = s.questions.map(raw => {
    const base = {courseId:c.id, courseTitle:c.title, sectionId:s.id, sectionTitle:s.title,
                  secType:s.type, fig: raw.fig || null, note: raw.note || ''};
    if (s.type === 'mcq') {
      return Object.assign(base, {id:raw.id, q: raw.q, opts: raw.options.slice(), ans: raw.ans});
    }
    return Object.assign(base, {id:raw.id, q: raw.q, opts: ['صح', 'خطأ'], ans: raw.ans ? 0 : 1});
  });
}));
/* Fast id -> item lookup used by the history and analytics views. */
const ITEMS = {};
DATA.forEach(c => c.sections.forEach(s => s.items.forEach(it => { ITEMS[it.id] = it; })));

};
let examTimerHandle = null;
function stopExamTimer(){
  if (examTimerHandle !== null){ clearInterval(examTimerHandle); examTimerHandle = null; }

function formatRemaining(ms){
  const seconds=Math.max(0,Math.ceil(ms/1000));
  return String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');
}
function startExamTimer(){
  stopExamTimer();
  if(state.view!=='quiz'||state.mode!=='exam'||!state.deadline)return;
  const tick=()=>{
    const left=Math.max(0,state.deadline-Date.now()),pill=$('#timerPill');
    if(pill)pill.textContent=formatRemaining(left);
    if(left<=0){stopExamTimer();finish(true);}
  };
  tick();

}

/* The ✕ button is rendered by the template only when a query exists, so it has
   to be added and removed as the field goes from empty to non-empty. */
function syncClearButton(){
  const wrap = document.querySelector('.qsearch');
  if (!wrap) return;
  const existing = document.getElementById('clearSearch');
  const hasText = !!state.searchQuery;
  if (hasText && !existing){
    const btn = document.createElement('button');
    btn.className = 'qsearch-x';
    btn.id = 'clearSearch';
    btn.type = 'button';
    btn.setAttribute('aria-label', 'مسح البحث');
    btn.textContent = '✕';
    btn.onclick = () => { state.searchQuery = ''; renderCourse(); };
    wrap.appendChild(btn);
  } else if (!hasText && existing){
    existing.remove();
  }
}

/* Paint the search results panel. Called on every keystroke, so it must stay
   cheap: searchCourse() is a plain linear scan over one course (~120 items). */
function paintSearchResults(course, query){
  const box = $('#searchResults');
  if (!box) return;
  const q = (query || '').trim();
  if (!q){ box.innerHTML = ''; return; }

  const started = performance.now();
  const hits = searchCourse(course, q);
  const elapsed = Math.round(performance.now() - started);
  const total = course.sections.reduce((n, sec) => n + sec.items.length, 0);

  if (!hits.length){
    box.innerHTML = `<div class="srch-empty">
      <b>مفيش نتائج لـ «${esc(q)}»</b>
      <span>جرّب كلمة أقصر أو كلمة من الشرح. البحث داخل ${esc(course.title)} فقط (${total} سؤال).</span>
    </div>`;
    return;
  }

  const MAX_SHOWN = 25;
  const shown = hits.slice(0, MAX_SHOWN);
  const rows = shown.map(({item, section}) => `
    <div class="srch-item" data-search-id="${esc(item.id)}">
      <div class="srch-q">${esc(item.q)}</div>
      <div class="srch-meta">
        <span class="srch-sec">${esc(section.title)}</span>
        <span class="srch-type">${item.secType === 'tf' ? 'صح/خطأ' : 'اختيار من متعدد'}</span>
        ${item.note ? '<span class="srch-note-flag">فيه شرح</span>' : ''}
      </div>
      <div class="srch-ans"><b>الإجابة:</b> ${esc(item.opts[item.ans])}</div>
      ${item.note ? `<div class="srch-note">${esc(item.note)}</div>` : ''}
    </div>`).join('');

  box.innerHTML = `
    <div class="srch-head">
      <b>${hits.length} نتيجة</b> من ${total} سؤال في ${esc(course.title)}
      ${hits.length > MAX_SHOWN ? `<span class="srch-cap">— أول ${MAX_SHOWN} بس</span>` : ''}
      <span class="srch-time">${elapsed} ms</span>
    </div>
    <div class="srch-list">${rows}</div>
    ${hits.length > 1 ? `<button class="primary" id="practiseResults" style="margin-top:12px;padding:11px 18px;font-size:14px">تدرّب على النتائج (${Math.min(hits.length, MAX_SHOWN)})</button>` : ''}`;

  const practise = $('#practiseResults');
  if (practise) practise.onclick = () => {
    const pool = hits.slice(0, MAX_SHOWN).map(({item, section}) => ({
      ...item, sec: section.title, secType: section.type,
    }));
    stopExamTimer(); dropSession();
    state.searchQuery = '';
    state.course = {id:'__search', title:'نتائج البحث', color:'var(--accent)', sections:[]};
    state.isReview = false;
    startQuiz(pool, {label: 'نتائج البحث'});
  };
}

function shuffleArr(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]] } return a }

function buildPool(sectionIds, filterFn){
  const c=state.course;let pool=[];
  c.sections.filter(s=>sectionIds.includes(s.id)).forEach(s=>{
    s.items.forEach(it=>pool.push({...it,sec:s.title,secType:s.type,courseId:c.id,courseTitle:c.title}));
  });
  if(filterFn)pool=pool.filter(filterFn);
  return pool;
}

    courseId: it.courseId, courseTitle: it.courseTitle,
  }));
  stopExamTimer();
  state.course = {id:'__review', title:'مراجعة الأخطاء', color:'var(--accent)', sections:[]};
  state.mode = 'study'; state.isReview = true;
  state.quiz = pool; state.answers = {}; state.idx = 0; state.view = 'quiz';
  state.reviewed = false; state.deadline = null;
  state.examRecorded = false; state.timeExpired = false;
  state.sessionId = openHistorySession({
    mode: 'study', courseId: '__review', courseTitle: 'مراجعة الأخطاء',
    isReview: true, total: pool.length,
  });
  render(); window.scrollTo(0,0);
}

function startQuiz(pool,options={}){
  let selected=pool?pool.slice():buildPool(state.picked);
  if(!pool&&state.mode==='exam'&&state.examCount!=='all'){
    const limit=Math.min(selected.length,Math.max(1,Number(state.examCount)||selected.length));
    if(limit<selected.length){const chosen=new Set(shuffleArr(selected.map((_,i)=>i)).slice(0,limit));selected=selected.filter((_,i)=>chosen.has(i));}
  }
  state.quiz=state.shuffle?shuffleArr(selected):selected;state.isReview=!!options.review;
  if(options.label&&state.course)state.course={...state.course,title:options.label};
  state.answers={};state.idx=0;state.view='quiz';state.reviewed=false;
  state.deadline=state.mode==='exam'&&state.timerEnabled?Date.now()+state.timerMinutes*60000:null;
  state.examRecorded=false;state.timeExpired=false;stopExamTimer();
  state.sessionId = openHistorySession({
    mode: state.mode,
    courseId: state.isReview ? '__review' : (state.course?.id || ''),
    courseTitle: state.isReview ? 'مراجعة الأخطاء' : (state.course?.title || ''),
    isReview: !!state.isReview,
    total: state.quiz.length,
  });
  render();window.scrollTo(0,0);
}

/* ---------- analytics view ---------- */
const AN_TABS = [
  {id:'overview', label:'نظرة عامة'},
  {id:'courses', label:'المقررات'},
  {id:'weak', label:'نقاط الضعف'},
  {id:'sessions', label:'المحاولات'},
];

function renderAnalytics(){
  const st = computeAnalytics();
  const active = state.anTab || 'overview';
  /* Mastery records can exist while the attempt history is empty (e.g. a
     migrated legacy review log, or history trimmed by age). Neither store is
     the single source of truth, so the screen must consider both. */
  const mastery = masterySummary(Date.now());
  const hasData = st.total > 0 || mastery.tracked > 0;

  const header = `
    <div style="padding-top:22px">
      <button class="icon-btn ghost" id="anBack">→ الرئيسية</button>
      <h1 style="font-size:26px;margin:16px 0 4px">تحليلات الأداء</h1>
      <p style="color:var(--ink-soft);margin:0 0 18px">
        ${hasData
          ? (st.total
              ? `ملخّص ${st.total.toLocaleString('ar-EG')} محاولة على ${st.uniqueCount.toLocaleString('ar-EG')} سؤال من ${Object.keys(st.byCourse).filter(k=>k!=='unknown').length} مقررات.`
              : `${mastery.tracked.toLocaleString('ar-EG')} سؤال متتبَّع في نظام المراجعة.`)
          : 'لسه ما فيش بيانات. ابدأ الحل وهتلاقي هنا كل تحليلاتك.'}
      </p>
    </div>`;

  const tabs = `<div class="tabs" role="tablist" aria-label="أقسام التحليلات">${
    AN_TABS.map(t => `<button role="tab" aria-selected="${t.id === active}" data-antab="${t.id}"
      class="${t.id === active ? 'sel' : ''}">${t.label}</button>`).join('')}</div>`;

  if (!hasData) {
    app.innerHTML = `${header}${tabs}
      <div class="an-panel"><div class="an-empty">
        مفيش محاولات مسجّلة لحد الآن.<br>
        <button class="primary" id="anStart" style="margin-top:14px">ابدأ الحل</button>
      </div></div>`;
    $('#anBack').onclick = goHome;
    if ($('#anStart')) $('#anStart').onclick = goHome;
    wireAnTabs();
    return;
  }

  let body = '';
  if (active === 'overview') body = analyticsOverview(st);
  else if (active === 'courses') body = analyticsCourses(st);
  else if (active === 'weak') body = analyticsWeak(st);
  else body = analyticsSessions(st);

  app.innerHTML = `${header}${tabs}<div id="anBody">${body}</div>`;
  $('#anBack').onclick = goHome;
  wireAnTabs();
  wireAnActions();
}

function wireAnTabs(){
  document.querySelectorAll('[data-antab]').forEach(b => {
    b.onclick = () => { state.anTab = b.dataset.antab; renderAnalytics(); window.scrollTo(0,0); };
  });
}
function wireAnActions(){
  const start = $('#anPracticeWeak');
  if (start) start.onclick = () => {
    const st = computeAnalytics();
    const weakIds = new Set(weakSections(st).slice(0, 5).map(w => w.courseId + '/' + w.sectionId));
    const pool = [];
    DATA.forEach(c => c.sections.forEach(sec => {
      if (!weakIds.has(c.id + '/' + sec.id)) return;
      sec.items.forEach(it => pool.push({...it, sec: sec.title, secType: sec.type}));
    }));
    if (!pool.length) return;
    state.isReview = false;
    state.course = {id:'__weak', title:'نقاط الضعف', color:'var(--accent)', sections:[]};
    startQuiz(pool, {label:'نقاط الضعف'});
  };
  const unpractised = $('#anPracticeNew');
  if (unpractised) unpractised.onclick = () => {
    const pool = unansweredQuestions().slice(0, 100);
    if (!pool.length) return;
    state.course = {id:'__new', title:'أسئلة جديدة', color:'var(--accent)', sections:[]};
    state.isReview = false;
    startQuiz(pool, {label:'أسئلة جديدة'});
  };
}

      <div class="an-bar"><span class="lbl">صحيحة</span><span class="val">${st.correct}</span>

      <div class="an-bar"><span class="lbl">خاطئة</span><span class="val">${st.wrong}</span>

function analyticsCourses(st){
  const rows = DATA.map(c => {
    const b = st.byCourse[c.id] || {total:0, correct:0};
    return {course:c, ...b, accuracy: b.total ? Math.round(b.correct/b.total*100) : null};
  }).filter(r => r.total > 0)
    .sort((a, b) => b.accuracy - a.accuracy);

  if (!rows.length) return '<div class="an-panel"><div class="an-empty">لا توجد محاولات في أي مقرر بعد.</div></div>';

  const bars = rows.map(r => {
    const color = r.accuracy >= 70 ? 'var(--ok)' : r.accuracy >= 50 ? '#f59e0b' : 'var(--bad)';
    return `<div class="an-bar">
      <span class="lbl">${esc(r.course.title)}</span>
      <span class="val">${r.correct}/${r.total} · ${r.accuracy}%</span>
      <div class="track"><i style="width:${r.accuracy}%;background:${color}"></i></div>
    </div>`;
  }).join('');

  const sections = Object.entries(st.bySection)
    .map(([key, b]) => {
      const [courseId, sectionId] = key.split('/');
      const meta = sectionMeta(courseId, sectionId);
      return {title: meta.sectionTitle, course: meta.courseTitle, ...b, accuracy: accuracyOf(b)};
    })
    .sort((a, b) => b.accuracy - a.accuracy || b.total - a.total);

  const secRows = sections.map(sec => `<div class="an-bar">
      <span class="lbl">${esc(sec.title)}</span>
      <span class="val">${sec.correct}/${sec.total} · ${sec.accuracy}%</span>
      <div class="track"><i style="width:${sec.accuracy}%;background:${sec.accuracy>=70?'var(--ok)':sec.accuracy>=50?'#f59e0b':'var(--bad)'}"></i></div>
    </div>`).join('');

  return `
    <div class="an-panel"><h3>الأداء لكل مقرر</h3>
      <p class="hint">مرتّبة من الأفضل إلى الأقل.</p>${bars}</div>
    <div class="an-panel"><h3>الأداء لكل قسم</h3>
      <p class="hint">${sections.length} قسم جرى عليه حل.</p>${secRows}</div>`;
}

/* Mastery distribution + the questions waiting for review. */
function masteryPanel(){
  const now = Date.now();
  const sum = masterySummary(now);
  if (!sum.tracked) return '';
  const labels = ['مبتدئ', 'يتحسن', 'جيد', 'متقن جزئيًا', 'متقن', 'مستقر'];
  const max = Math.max(1, ...sum.byLevel);
  const rows = sum.byLevel.map((n, i) => {
    const colour = i >= MASTERY_MASTERED ? 'var(--ok)' : i === 0 ? 'var(--bad)' : i <= 2 ? '#f59e0b' : 'var(--accent)';
    return `<div class="lv-row">
      <span class="lv-lbl">${labels[i]}</span>
      <div class="lv-track"><i style="width:${Math.round(n/max*100)}%;background:${colour}"></i></div>
      <span class="lv-n">${n}</span>
    </div>`;
  }).join('');

  const upcoming = Object.values(loadMastery().items)
    .filter(r => (r.due || 0) > now && ITEMS[r.id])
    .sort((a, b) => a.due - b.due)
    .slice(0, 5)
    .map(r => {
      const it = ITEMS[r.id];
      const days = daysUntil(r.due, now);
      return `<div class="sess">
        <div class="t"><b>${esc(it.courseTitle)}</b> <span>${esc(it.sectionTitle)} · المستوى ${r.level} من ${MASTERY_MAX_LEVEL}</span></div>
        <div class="p" style="color:var(--ink-soft)">${days ? days + ' يوم' : 'قريبًا'}</div>
      </div>`;
    }).join('');

  return `<div class="an-panel">
    <h3>نظام المراجعة الذكية</h3>
    <p class="hint">${sum.tracked} سؤال متتبَّع · ${sum.due} مستحق الآن · ${sum.mastered} مستقر (يرجع كل 28 يومًا)</p>
    <div class="lv-wrap" style="margin-top:6px;padding-top:0;border-top:0">${rows}</div>
    ${upcoming ? `<div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line)">
      <div class="lv-head">أقرب أسئلة في الانتظار</div>${upcoming}</div>` : ''}
  </div>`;
}

function analyticsSessions(st){
  const h = loadHistory();
  const sessions = h.sessions.slice(-40).reverse();
  const finished = sessions.filter(s => s.finished);
  const avg = finished.length
    ? Math.round(finished.reduce((n, s) => n + (s.pct || 0), 0) / finished.length) : 0;

  if (!sessions.length) return '<div class="an-panel"><div class="an-empty">لا توجد جلسات مسجّلة بعد.</div></div>';

  const rows = sessions.map(s2 => {
    const when = new Date(s2.start);
    const date = when.toLocaleDateString('ar-EG', {day:'numeric', month:'short'});
    const time = when.toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'});
    const pct = s2.pct !== undefined ? s2.pct : (s2.total ? Math.round(s2.correct / s2.total * 100) : 0);
    const color = pct >= 70 ? 'var(--ok)' : pct >= 50 ? '#f59e0b' : 'var(--bad)';
    const badge = s2.finished ? '' : ' · لم تُكمل';
    return `<div class="sess">
      <div class="t"><b>${esc(s2.courseTitle || '—')}${s2.isReview ? ' (مراجعة)' : ''}</b>
        <span>${date} · ${time} · ${s2.mode === 'exam' ? 'امتحان' : 'تدريب'}${badge}${s2.timedOut ? ' · انتهى الوقت' : ''}</span></div>
      <div class="p" style="color:${s2.finished ? color : 'var(--ink-soft)'}">${s2.finished ? pct + '%' : s2.answered + '/' + s2.total}</div>
    </div>`;
  }).join('');

  return `
    <div class="an-grid">
      <div class="an-card"><b>${sessions.length}</b><span>جلسة (آخر 40)</span></div>
      <div class="an-card"><b>${finished.length}</b><span>جلسة مكتملة</span></div>

    </div>
    <div class="an-panel"><h3>آخر الجلسات</h3>
      <p class="hint">الجلسات غير المكتملة تظهر بنسبة الإنجاز بدلًا من الدرجة.</p>${rows}</div>`;
}

/* ---------- quiz ---------- */
function answeredCount(){ return Object.keys(state.answers).length }
function scoreNow(){
  let ok=0, bad=0;
  state.quiz.forEach((q,i)=>{
    const a = state.answers[i]; if(a===undefined || a===-1) return;
    if(a===q.ans) ok++; else bad++;
  });
  return {ok,bad};
}

function qCard(q, i, opts={}){
  const given = state.answers[i];
  const showFeedback = state.mode==='study' && given!==undefined;
  const fig = q.fig && FIGS[q.fig]
    ? `<div class="qfig"><img src="${FIGS[q.fig]}" alt="شكل توضيحي" data-zoom="${q.fig}">`
      + `<span class="zoombar">اضغط على الشكل لعرضه بحجم أكبر</span></div>`
    : '';
  const options = q.opts.map((o,j)=>{
    let cls = 'opt';
    if (state.mode==='study' && given!==undefined){
      cls += ' locked';
      if (j===q.ans) cls += ' correct';
      else if (j===given) cls += ' wrong';
    } else if (given===j) cls += ' sel';
    const mk = (state.mode==='study' && given!==undefined) ? (j===q.ans?'✓':(j===given?'✕':'')) : '';
    const selected = given === j;
    const label = state.mode==='study' && given!==undefined
      ? (j===q.ans ? 'إجابة صحيحة' : selected ? 'إجابة خاطئة' : '')
      : '';
    return `<button type="button" class="${cls}" data-q="${i}" data-o="${j}"
      role="radio" aria-checked="${selected ? 'true' : 'false'}"
      ${state.mode==='study'&&given!==undefined?'aria-disabled="true"':''}
      aria-label="${esc(LETTERS[j] || j + 1)}. ${esc(o)}${label ? ' — ' + label : ''}">
      <span class="k" aria-hidden="true">${q.secType==='tf' ? (j===0?'✓':'✗') : LETTERS[j]}</span>
      <span>${esc(o)}</span><span class="mark" aria-hidden="true">${mk}</span>
    </button>`;
  }).join('');
  const revealed = given === -1;
  const fb = showFeedback
    ? `<div class="feedback show ${revealed ? 'ok' : (given===q.ans?'ok':'bad')}" role="status" aria-live="polite">${
        revealed ? `الإجابة الصحيحة: <b>${esc(q.opts[q.ans])}</b>`
        : given===q.ans ? '✓ إجابة صحيحة'
        : `✕ إجابة غير صحيحة — الإجابة الصحيحة: <b>${esc(q.opts[q.ans])}</b>`
      }${q.note?`<div style="font-weight:600;opacity:.85;margin-top:4px">${esc(q.note)}</div>`:''}</div>`
    : '';
  const extra = opts.single ? '' : `
    <div class="q-actions">
      ${state.mode==='study' && given===undefined ? `<button class="mini" data-reveal="${i}">إظهار الإجابة</button>` : ''}
      <button class="mini" data-reset="${i}">مسح الاختيار</button>
    </div>`;
  const optCount = q.opts.length;
  return `<article class="q" id="q${i}" aria-labelledby="qh${i}">
    <div class="q-head"><div class="qnum" aria-hidden="true">${i+1}</div><div class="qtext" id="qh${i}"><span class="sr-only">السؤال ${i+1} من ${state.quiz.length}. </span>${esc(q.q)}${state.isReview?`<span class="q-source">${esc(q.courseTitle||'')} · ${esc(q.sec||'')}</span>`:''}</div></div>
    ${fig}
    <div class="opts" role="radiogroup" aria-labelledby="qh${i}" aria-describedby="qhelp${i}">
      <span class="sr-only" id="qhelp${i}">${optCount} اختيارات. استخدم أرقام 1 إلى ${optCount} أو الأسهم للتنقل.</span>
      ${options}
    </div>
    ${fb}${extra}
  </article>`;
}

function renderQuiz(){
  saveSession();
  const c = state.course;
  const exam = state.mode === 'exam';
  if (!state.quiz.length){
    app.innerHTML = '<div class="empty">لا توجد أسئلة في الاختيار الحالي.</div>';
    return;
  }
  const {ok,bad} = scoreNow();
  const done = answeredCount(), total = state.quiz.length;
  const pct = Math.round(done/total*100);
  const bar = `
  <div class="qbar"><div class="wrap inner">
    <button class="icon-btn ghost" id="quitBtn" title="خروج">✕<span class="lbl"> خروج</span></button>
    <div class="progress"><i style="width:${pct}%"></i></div>
    <div class="counters">
      ${exam&&state.deadline?'<span class="pill timer" id="timerPill">--:--</span>':''}
      <span class="pill">${done} / ${total}</span>
      ${exam ? '' : `<span class="pill ok">✓ ${ok}</span><span class="pill bad">✕ ${bad}</span>`}
    </div>
    <button class="primary" id="finishBtn" style="padding:10px 18px;font-size:14px">${exam?'تسليم':'النتيجة'}</button>
  </div></div>`;

  if (exam){
    const i = state.idx, q = state.quiz[i];
    const jump = state.quiz.map((_,j)=>`<button class="${state.answers[j]!==undefined?'done':''} ${j===i?'cur':''}" data-jump="${j}">${j+1}</button>`).join('');
    app.innerHTML = `${bar}
      <div class="exam-card">
        ${qCard(q,i,{single:true})}
        <div class="nav">
          <button class="ghost-btn" id="prevBtn" ${i===0?'disabled':''}>→ السابق</button>
          <span style="color:var(--ink-soft);font-size:13.5px;font-weight:700">السؤال ${i+1} من ${total}</span>
          ${i===total-1 ? `<button class="primary" id="finishBtn2">عرض النتيجة</button>`
                        : `<button class="primary" id="nextBtn">التالي ←</button>`}
        </div>
        <div class="jump">${jump}</div>
      </div>`;
    $('#prevBtn').onclick = () => { if(state.idx>0){ state.idx--; render(); } };
    if ($('#nextBtn')) $('#nextBtn').onclick = () => { state.idx++; render(); window.scrollTo(0,0); };
    if ($('#finishBtn2')) $('#finishBtn2').onclick = () => finish();
    document.querySelectorAll('[data-jump]').forEach(b=> b.onclick = () => { state.idx = +b.dataset.jump; render(); window.scrollTo(0,0); });
  } else {
    app.innerHTML = `${bar}<div class="qlist">${state.quiz.map((q,i)=>qCard(q,i)).join('')}</div>`;
  }

  $('#quitBtn').onclick = () => { state.isReview ? goHome() : openCourse(state.course.id); };
  $('#finishBtn').onclick = () => finish();
  wireZoom();

  document.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => {
      const i = +btn.dataset.q, o = +btn.dataset.o;
      if (state.mode==='study' && state.answers[i]!==undefined) return;
      state.answers[i] = o;
      if(state.mode==='study')recordAttempt(state.quiz[i],o,state.course);
      if (state.mode==='study'){ renderQuiz(); keepScroll(i); }
      else { renderQuiz(); }
    };
  });
  document.querySelectorAll('[data-reveal]').forEach(b => b.onclick = () => {
    const i = +b.dataset.reveal;
    if (state.answers[i] === undefined) { state.answers[i] = -1; recordAttempt(state.quiz[i],-1,state.course); renderQuiz(); keepScroll(i); }
  });
  document.querySelectorAll('[data-reset]').forEach(b => b.onclick = () => {
    const i = +b.dataset.reset; delete state.answers[i]; renderQuiz(); keepScroll(i);
  });
  startExamTimer();
}

function openLightbox(key){
  if (!FIGS[key]) return;
  const lb = document.createElement('div');
  lb.className = 'lightbox';
  lb.innerHTML = `<button class="lb-x" aria-label="إغلاق">✕</button><img src="${FIGS[key]}" alt="شكل">`;
  lb.onclick = () => lb.remove();
  document.body.appendChild(lb);
}
function wireZoom(){
  document.querySelectorAll('[data-zoom]').forEach(img => {
    img.onclick = e => { e.stopPropagation(); openLightbox(img.dataset.zoom); };
  });
}

function keepScroll(i){
  const el = document.getElementById('q'+i);
  if (!el) return;
  syncBars();
  const top = document.querySelector('.top'), qb = document.querySelector('.qbar');
  const off = (top ? top.getBoundingClientRect().height : 0) +
              (qb ? qb.getBoundingClientRect().height : 0) + 10;
  const y = el.getBoundingClientRect().top + window.pageYOffset - off;
  window.scrollTo({top: Math.max(0, y), behavior:'auto'});
}

/* ---------- result ---------- */
function finish(timeExpired=false){
  if(state.view==='result')return;
  stopExamTimer();if(timeExpired)state.timeExpired=true;
  closeHistorySession(true);
  if(state.mode==='exam'&&!state.examRecorded){
    state.quiz.forEach((q,i)=>recordAttempt(q,state.answers[i]===undefined?-1:state.answers[i],state.course));
    state.examRecorded=true;
  }
  state.view='result';state.reviewed=true;
  const {ok,bad}=scoreNow(),total=state.quiz.length,pct=total?Math.round(ok/total*100):0;
  const best=store.get('qb.best',{});
  if(!state.isReview&&(!best[state.course.id]||pct>best[state.course.id])){
    best[state.course.id]=pct;store.set('qb.best',best);
  }
  render();window.scrollTo(0,0);
}

function renderResult(){
  saveSession();
  const {ok,bad} = scoreNow();
  const total = state.quiz.length;
  const pct = total? Math.round(ok/total*100) : 0;
  const color = pct>=80 ? 'var(--ok)' : pct>=50 ? '#f59e0b' : 'var(--bad)';
  const msg = pct>=90 ? 'ممتاز جدًا! جاهز للميد تيرم 🎉' : pct>=75 ? 'نتيجة قوية، كمّل مراجعة الأخطاء 💪' : pct>=50 ? 'أساس جيد — راجع الأسئلة التي أخطأت فيها.' : 'محاولة أولى، ركّز على المراجعة ثم أعد المحاولة.';
  const wrong = state.quiz.map((q,i)=>({q,i,a:state.answers[i]}))
    .filter(x=>x.a===undefined||x.a===-1||x.a!==x.q.ans);
  const skipped = state.quiz.filter((q,i)=>state.answers[i]===undefined || state.answers[i]===-1).length;
  const review = wrong.map(({q,i,a})=>`
    <div class="rev-item">
      <div class="rev-q">${i+1}. ${esc(q.q)}</div>
      ${q.courseTitle?`<div class="rev-line"><b>المقرر:</b> <span>${esc(q.courseTitle)}</span></div>`:''}
      <div class="rev-line bad"><b>إجابتك:</b> <span>${a===undefined||a===-1?'لم تحل السؤال':esc(q.opts[a])}</span></div>
      <div class="rev-line ok"><b>الصحيحة:</b> <span>${esc(q.opts[q.ans])}</span></div>
      ${q.note?`<div class="rev-line" style="color:var(--ink-soft)"><b>ملاحظة:</b> <span>${esc(q.note)}</span></div>`:''}
    </div>`).join('');
  app.innerHTML = `
  <div class="result">
    <div class="ring" style="--p:${pct};--rc:${color}"><div><b style="color:${color}">${pct}%</b><span>${ok} من ${total}</span></div></div>
    <h2 class="rtitle">${state.timeExpired?'انتهى وقت الامتحان':msg}</h2>
    <p class="rsub">${esc(state.course.title)}${state.timeExpired?' • تم تسليم الإجابات تلقائيًا':''}${skipped?` • ${skipped} سؤال بدون إجابة`:''}</p>
    <div class="rstats">
      <div class="rstat"><b style="color:var(--ok)">${ok}</b><span>صحيحة</span></div>
      <div class="rstat"><b style="color:var(--bad)">${bad}</b><span>خاطئة</span></div>
      <div class="rstat"><b>${total}</b><span>إجمالي</span></div>
    </div>
    <div class="actions">
      <button class="primary" id="againAll">إعادة كل الأسئلة</button>
      ${wrong.length?`<button class="ghost-btn" id="againWrong">إعادة الأخطاء فقط (${wrong.length})</button>`:''}
      <button class="ghost-btn" id="backCourse">${state.isReview?'العودة للرئيسية':'رجوع للمقرر'}</button>
    </div>
    ${wrong.length?`<div class="review"><h3>مراجعة الأخطاء</h3>${review}</div>`:''}
  </div>`;
  $('#againAll').onclick=()=>startQuiz(state.quiz.slice(),{review:state.isReview});
  if($('#againWrong'))$('#againWrong').onclick=()=>startQuiz(wrong.map(w=>w.q),{review:state.isReview});
  $('#backCourse').onclick=()=>state.isReview?goHome():openCourse(state.course.id);
}

/* ---------- keyboard ---------- */
/* Ignore shortcuts while the user is typing in a real form control so the
   timer field and select boxes keep working normally. */
function isTypingTarget(el){
  if (!el) return false;
  const tag = el.tagName;
  return tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA' || el.isContentEditable;
}

document.addEventListener('keydown', e => {
  if (state.view !== 'quiz') return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (isTypingTarget(e.target)) return;

  const n = parseInt(e.key, 10);
  if (state.mode === 'exam'){
    /* one question per screen: numbers answer, arrows page, Enter submits */
    const q = state.quiz[state.idx];
    if (!q || !q.opts) return;
    if (n >= 1 && n <= q.opts.length){ state.answers[state.idx] = n-1; renderQuiz(); }
    if (e.key === 'ArrowLeft'){ if(state.idx < state.quiz.length-1){ state.idx++; renderQuiz(); window.scrollTo(0,0); } }
    if (e.key === 'ArrowRight'){ if(state.idx > 0){ state.idx--; renderQuiz(); window.scrollTo(0,0); } }
    if (e.key === 'Enter' && state.idx === state.quiz.length-1) finish();
    return;
  }

  /* study mode shows every question at once, so the shortcuts act on whichever
     card currently holds focus (or the first unanswered one). */
  const card = e.target.closest ? e.target.closest('.q') : null;
  let index = card ? Number(card.id.replace('q', '')) : -1;
  if (!(index >= 0) || index >= state.quiz.length){
    index = state.quiz.findIndex((_, i) => state.answers[i] === undefined);
  }
  const q = state.quiz[index];
  if (!q || !q.opts) return;
  if (n >= 1 && n <= q.opts.length){
    if (state.answers[index] !== undefined) return;   // locked after answering
    state.answers[index] = n-1;
    recordAttempt(q, n-1, state.course);
    renderQuiz();
    keepScroll(index);
    return;
  }
  if (e.key === 'Enter'){
    if (state.answers[index] === undefined){
      e.preventDefault();
      state.answers[index] = -1;
      recordAttempt(q, -1, state.course);
      renderQuiz();
      keepScroll(index);
    }
  }
});

/* ---------- PWA: offline + updates ----------
   This block must never break the app. Every call is wrapped because file://
   origins (and some in-app browsers) do not expose serviceWorker at all. */
(function initPWA(){
  const banner = document.getElementById('pwaToast');
  let dismissTimer = null;

  function toast(message, actionLabel, onAction, sticky){
    if (!banner) return;
    banner.innerHTML = '';
    const msg = document.createElement('span');
    msg.className = 'pwa-msg';
    msg.textContent = message;
    banner.appendChild(msg);
    if (actionLabel){
      const btn = document.createElement('button');
      btn.className = 'pwa-act';
      btn.type = 'button';
      btn.textContent = actionLabel;
      btn.onclick = () => { banner.classList.remove('show'); onAction && onAction(); };
      banner.appendChild(btn);
    }
    banner.classList.add('show');
    if (dismissTimer) clearTimeout(dismissTimer);
    if (!sticky) dismissTimer = setTimeout(() => banner.classList.remove('show'), 6000);
  }

  /* Offline / online indicator */
  function paintConnection(){
    if (navigator.onLine === false) toast('أنت غير متصل — الموقع شغال من النسخة المحفوظة', null, null, true);
    else if (banner && banner.classList.contains('show')) banner.classList.remove('show');
  }
  window.addEventListener('online', paintConnection);
  window.addEventListener('offline', paintConnection);
  if (navigator.onLine === false) paintConnection();

  if (!('serviceWorker' in navigator)) return;
  if (location.protocol === 'file:') return;   // SW is not available on file://

  navigator.serviceWorker.register('sw.js').then((reg) => {
    /* A new worker is waiting: offer a one-tap refresh. */
    function offerUpdate(worker){
      toast('فيه نسخة جديدة من الموقع', 'تحديث', () => {
        worker.postMessage('SKIP_WAITING');
      }, true);
    }
    if (reg.waiting) offerUpdate(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const fresh = reg.installing;
      if (!fresh) return;
      fresh.addEventListener('statechange', () => {
        if (fresh.state === 'installed' && navigator.serviceWorker.controller) offerUpdate(fresh);
      });
    });
    navigator.serviceWorker.addEventListener('controllerchange', () => location.reload());

    /* Ask for a periodic update check (once a day is plenty). */
    setInterval(() => reg.update().catch(() => {}), 24 * 60 * 60 * 1000);
  }).catch((err) => {
    /* Registration failing must not affect studying. */
    if (window.console && console.warn) console.warn('SW registration skipped:', err && err.message);
  });
})();

render();
</script>
