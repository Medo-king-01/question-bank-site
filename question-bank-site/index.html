<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%234f46e5'/%3E%3Ctext x='32' y='44' font-size='34' font-family='sans-serif' font-weight='bold' text-anchor='middle' fill='%23fff'%3EA%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#f4f6fb; --bg2:#eaeefb; --card:#ffffff; --ink:#101828; --ink-soft:#5b6478;
  --line:#e3e8f2; --accent:#4f46e5; --accent-soft:#eef0ff;
  --ok:#12a26b; --ok-soft:#e8f8f1; --bad:#e5484d; --bad-soft:#fdecec;
  --shadow:0 10px 30px rgba(16,24,40,.08); --shadow-sm:0 2px 10px rgba(16,24,40,.06);
  --radius:20px; --topH:64px; --qbarH:0px;
}
[data-theme="dark"]{
  --bg:#0b1020; --bg2:#0f1730; --card:#141c33; --ink:#eef2ff; --ink-soft:#9aa6c4;
  --line:#243052; --accent:#7c8cff; --accent-soft:#1c2445;
  --ok:#3ddc97; --ok-soft:#10281f; --bad:#ff6b6b; --bad-soft:#2a1518;
  --shadow:0 12px 34px rgba(0,0,0,.45); --shadow-sm:0 2px 10px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}
body{
  touch-action:manipulation;
  font-family:"Segoe UI","Noto Naskh Arabic",Tahoma,"Helvetica Neue",Arial,sans-serif;
  background:linear-gradient(180deg,var(--bg),var(--bg2) 60%,var(--bg));
  color:var(--ink); min-height:100vh; min-height:100dvh;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
  overflow-x:hidden;
}
button{font-family:inherit;touch-action:manipulation}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}

/* ---------- top bar ---------- */
.top{
  position:sticky;top:0;z-index:40;backdrop-filter:blur(14px);
  padding-top:env(safe-area-inset-top);
  background:color-mix(in srgb, var(--bg) 82%, transparent);
  border-bottom:1px solid var(--line);
}
.top .inner{display:flex;align-items:center;gap:12px;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.2px}
.brand .logo{
  width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:19px;
  background:linear-gradient(135deg,#4f46e5,#8b5cf6);color:#fff;box-shadow:0 6px 16px rgba(79,70,229,.35)
}
.spacer{flex:1}
.icon-btn{
  border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;
  height:38px;min-width:38px;padding:0 12px;display:inline-flex;align-items:center;gap:7px;
  cursor:pointer;font-size:14px;font-weight:600;transition:.15s;box-shadow:var(--shadow-sm)
}
.icon-btn:hover{transform:translateY(-1px)}
.icon-btn.ghost{background:transparent;box-shadow:none}

/* ---------- hero ---------- */
.hero{padding:38px 0 10px;text-align:center}
.hero h1{font-size:clamp(24px,4.4vw,38px);margin:0 0 10px;letter-spacing:-.5px;line-height:1.3}
.hero p{margin:0 auto;max-width:640px;color:var(--ink-soft);font-size:16px;line-height:1.7}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:18px}
.chip{
  background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 15px;
  font-size:13.5px;font-weight:700;color:var(--ink-soft);box-shadow:var(--shadow-sm)
}

/* ---------- cards ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin:26px 0 50px}
.course-card{
  position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px;cursor:pointer;transition:.2s;box-shadow:var(--shadow-sm);overflow:hidden;text-align:right
}
.course-card:before{
  content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:6px;background:var(--c,var(--accent))
}
.course-card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--c) 40%, var(--line))}
.cc-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.cc-emoji{
  width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:23px;
  background:color-mix(in srgb,var(--c) 14%, var(--card));border:1px solid color-mix(in srgb,var(--c) 26%, transparent)
}
.cc-title{font-weight:800;font-size:17px;line-height:1.4}
.cc-meta{color:var(--ink-soft);font-size:13px;margin-top:4px;font-weight:600;display:flex;flex-wrap:wrap;gap:0 6px;align-items:center}
.cc-meta .ccm{white-space:nowrap}
.cc-meta .ccm.sep{opacity:.45}
.cc-foot{display:flex;align-items:center;justify-content:space-between;margin-top:16px;gap:10px}
.badge{
  font-size:12.5px;font-weight:800;padding:6px 11px;border-radius:999px;
  background:var(--accent-soft);color:var(--accent)
}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.go{
  font-size:13.5px;font-weight:800;color:var(--c,var(--accent));display:inline-flex;align-items:center;gap:6px
}

/* ---------- setup ---------- */
.setup{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);margin:22px 0 26px}
.setup h2{margin:0 0 4px;font-size:19px}
.setup .sub{color:var(--ink-soft);font-size:13.5px;margin-bottom:18px}
.label{font-size:13px;font-weight:800;color:var(--ink-soft);margin:16px 0 9px}
.seg{display:flex;flex-wrap:wrap;gap:9px}
.seg button{
  border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;
  padding:10px 15px;cursor:pointer;font-weight:700;font-size:14px;transition:.15s
}
.seg button.sel{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.modecards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:620px){.modecards{grid-template-columns:1fr}}
.modecard{
  border:1.5px solid var(--line);border-radius:15px;padding:15px;cursor:pointer;background:var(--card);
  display:flex;gap:12px;align-items:flex-start;transition:.15s;text-align:right
}
.modecard.sel{border-color:var(--accent);background:var(--accent-soft)}
.modecard .mi{font-size:22px}
.modecard b{display:block;font-size:15px;margin-bottom:3px}
.modecard span{color:var(--ink-soft);font-size:12.8px;line-height:1.6}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.switch{display:inline-flex;align-items:center;gap:9px;cursor:pointer;font-size:14px;font-weight:700;user-select:none}
.switch input{display:none}
.track{width:44px;height:25px;border-radius:999px;background:var(--line);position:relative;transition:.2s}
.track:after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.switch input:checked + .track{background:var(--accent)}
.switch input:checked + .track:after{inset-inline-start:22px}
.primary{
  border:none;border-radius:14px;padding:15px 26px;font-weight:800;font-size:16px;cursor:pointer;
  background:linear-gradient(135deg,var(--accent),#8b5cf6);color:#fff;box-shadow:0 10px 24px rgba(79,70,229,.32);
  transition:.15s
}
.primary:hover{transform:translateY(-2px)}
.primary:disabled{opacity:.5;cursor:not-allowed;transform:none}

/* ---------- quiz ---------- */
.qbar{
  position:sticky;top:var(--topH);z-index:30;background:color-mix(in srgb,var(--bg) 88%, transparent);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:11px 0
}
.qbar .inner{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.progress{flex:1;height:9px;background:var(--line);border-radius:99px;overflow:hidden;min-width:120px}
.progress i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--accent),#22d3ee);transition:width .3s}
.counters{display:flex;gap:8px;font-size:13px;font-weight:800}
.pill{padding:5px 11px;border-radius:99px;background:var(--card);border:1px solid var(--line)}
.pill.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 30%,var(--line))}
.pill.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 30%,var(--line))}

.qlist{display:flex;flex-direction:column;gap:16px;padding:20px 0 90px}
.q{
  background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 18px 14px;
  box-shadow:var(--shadow-sm);scroll-margin-top:calc(var(--topH) + var(--qbarH) + 12px)
}
.q-head{display:flex;gap:11px;align-items:flex-start;margin-bottom:14px}
.qnum{
  flex:0 0 auto;min-width:32px;height:32px;padding:0 8px;border-radius:10px;display:grid;place-items:center;
  background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:14px
}
.qtext{font-size:16.5px;font-weight:700;line-height:1.75;flex:1}
.qfig{margin:6px 0 14px;text-align:center}
.qfig img{max-width:100%;max-height:330px;border-radius:12px;border:1px solid var(--line);background:#fff;padding:6px;cursor:zoom-in}
.zoombar{display:block;font-size:11.5px;color:var(--ink-soft);font-weight:700;margin-top:4px}
.lightbox{position:fixed;inset:0;z-index:80;background:rgba(8,12,26,.9);display:flex;align-items:center;
  justify-content:center;padding:14px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:92vh;border-radius:10px;background:#fff;padding:8px}
.lightbox .lb-x{position:absolute;top:calc(10px + env(safe-area-inset-top));inset-inline-end:14px;width:40px;height:40px;
  border-radius:50%;border:none;background:#fff;color:#111;font-size:20px;font-weight:800;cursor:pointer}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{
  display:grid;grid-template-columns:28px 1fr 20px;align-items:center;gap:11px;border:1.5px solid var(--line);background:var(--card);
  border-radius:13px;padding:12px 14px;cursor:pointer;text-align:right;font-size:15px;line-height:1.6;
  transition:.12s;width:100%;color:var(--ink)
}
.opt:hover:not(.locked){border-color:var(--accent);background:var(--accent-soft)}
.opt .k{
  width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-weight:800;
  font-size:13px;background:var(--bg2);color:var(--ink-soft);border:1px solid var(--line)
}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .k{background:var(--ok);color:#fff;border-color:transparent}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:#fff;border-color:transparent}
.opt.locked{cursor:default}
.opt .mark{font-weight:900;text-align:center;font-size:15px}
.feedback{
  margin-top:12px;border-radius:12px;padding:11px 14px;font-size:14px;font-weight:700;line-height:1.7;
  display:none
}
.feedback.show{display:block}
.feedback.ok{background:var(--ok-soft);color:var(--ok)}
.feedback.bad{background:var(--bad-soft);color:var(--bad)}
.q-actions{display:flex;gap:9px;margin-top:11px;flex-wrap:wrap}
.mini{
  border:1px solid var(--line);background:transparent;color:var(--ink-soft);border-radius:10px;
  padding:7px 12px;font-size:12.8px;font-weight:700;cursor:pointer
}
.mini:hover{color:var(--accent);border-color:var(--accent)}

/* exam nav */
.exam-card{padding:22px 0 24px}
.nav{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:20px;flex-wrap:wrap}
.jump{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
.jump button{
  width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--card);
  color:var(--ink-soft);font-weight:800;font-size:12.5px;cursor:pointer
}
.jump button.done{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.jump button.cur{outline:2px solid var(--accent);outline-offset:1px}

/* result */
.result{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:26px;box-shadow:var(--shadow);margin:24px 0}
.ring{
  width:150px;height:150px;border-radius:50%;display:grid;place-items:center;margin:0 auto 16px;position:relative;
  background:conic-gradient(var(--rc) calc(var(--p)*1%), var(--line) 0)
}
.ring:before{content:"";position:absolute;inset:11px;border-radius:50%;background:var(--card)}
.ring div{position:relative;text-align:center}
.ring b{font-size:32px;display:block;line-height:1}
.ring span{font-size:12.5px;color:var(--ink-soft);font-weight:700}
.rtitle{text-align:center;font-size:21px;font-weight:800;margin:0 0 6px}
.rsub{text-align:center;color:var(--ink-soft);font-size:14px;margin-bottom:20px}
.rstats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0 auto 22px;max-width:520px}
.rstat{background:var(--bg2);border-radius:14px;padding:14px;text-align:center}
.rstat b{display:block;font-size:22px}
.rstat span{font-size:12.5px;color:var(--ink-soft);font-weight:700}
.review{margin-top:8px}
.review h3{font-size:16px;margin:20px 0 12px}
.rev-item{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;background:var(--card)}
.rev-q{font-weight:700;font-size:14.5px;line-height:1.7;margin-bottom:9px}
.rev-line{font-size:13.5px;margin-top:5px;display:flex;gap:7px;align-items:flex-start}
.rev-line b{font-weight:800;flex:0 0 auto}
.rev-line.bad{color:var(--bad)}
.rev-line.ok{color:var(--ok)}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:22px}
.ghost-btn{
  border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:13px;
  padding:13px 20px;font-weight:800;font-size:14.5px;cursor:pointer
}
.ghost-btn:hover{border-color:var(--accent);color:var(--accent)}
/* ---------- footer / maker ---------- */
.foot{padding:26px 0 calc(34px + env(safe-area-inset-bottom));text-align:center}
.foot-note{color:var(--ink-soft);font-size:12.5px;line-height:1.8;margin-top:14px}
.maker{
  display:inline-flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center;
  background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:12px 18px;box-shadow:var(--shadow-sm)
}
.maker .mk-txt{display:flex;flex-direction:column;align-items:flex-start;line-height:1.35}
.maker .mk-by{font-size:11.5px;font-weight:700;color:var(--ink-soft);letter-spacing:.4px}
.maker .mk-name{
  font-size:16px;font-weight:900;letter-spacing:.3px;
  background:linear-gradient(135deg,var(--accent),#8b5cf6);
  -webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap
}
.maker .mk-div{width:1px;height:30px;background:var(--line)}
.wa-btn{
  display:inline-flex;align-items:center;gap:9px;text-decoration:none;
  background:linear-gradient(135deg,#25d366,#12b352);color:#fff;
  border-radius:12px;padding:9px 15px;font-weight:800;font-size:13.5px;
  box-shadow:0 6px 16px rgba(18,179,82,.28);transition:.15s;white-space:nowrap;
  direction:ltr
}
.wa-btn:hover{transform:translateY(-2px);box-shadow:0 9px 22px rgba(18,179,82,.38);color:#fff}
.wa-btn svg{flex:0 0 auto}
.wa-btn .num{font-variant-numeric:tabular-nums;letter-spacing:.2px}

.empty{text-align:center;color:var(--ink-soft);padding:60px 20px}
.hide{display:none !important}
/* =======================  mobile / tablet  ======================= */
@media(max-width:820px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;margin:18px 0 34px}
  .setup{padding:16px}
  .result{padding:18px}
  .rstats{max-width:none}
}
@media(max-width:640px){
  .wrap{padding:0 14px}
  .brand span{display:none}
  .top .inner{height:54px;gap:8px}
  .icon-btn{height:40px;min-width:40px;padding:0 11px;font-size:13.5px;border-radius:11px}
  .hero{padding:20px 0 6px}
  .hero h1{font-size:26px;line-height:1.35}
  .hero p{font-size:14.5px;line-height:1.75}
  .chips{gap:8px;margin-top:14px}
  .chip{padding:7px 12px;font-size:12.5px}
  .course-card{padding:15px 16px}
  .cc-emoji{width:40px;height:40px;border-radius:12px}
  .cc-title{font-size:16px}
  .cc-meta{font-size:12px;line-height:1.6}
  .cc-foot{margin-top:12px}
  .cc-foot .go{font-size:13px}
  .grid{grid-template-columns:1fr}

  .setup h2{font-size:17px}
  .setup .sub{font-size:12.8px;margin-bottom:12px}
  .label{margin:14px 0 8px}
  .seg{gap:7px}
  .seg button{padding:9px 12px;font-size:13px;border-radius:11px}
  .modecard{padding:12px;gap:10px}
  .modecard b{font-size:14px}
  .modecard span{font-size:12.2px}
  .primary{padding:14px 20px;font-size:15px;width:100%}
  .setup .row .primary{width:100%}

  /* --- quiz toolbar: quit + counters + button on one row, progress under --- */
  .qbar{padding:8px 0}
  .qbar .inner{gap:8px;row-gap:7px}
  .qbar .progress{order:9;flex:1 0 100%;height:6px;min-width:0}
  .qbar .icon-btn{height:34px;padding:0 10px;font-size:13px}
  .qbar{background:var(--bg2);border-bottom:1px solid var(--line)}
  .qbar .primary{width:auto;padding:8px 14px;font-size:13px;border-radius:11px}
  .counters{gap:5px;font-size:11.5px;margin-inline-start:auto;font-weight:800}
  .pill{padding:3px 8px;border-radius:8px;background:var(--card)}

  /* --- questions --- */
  .qlist{gap:12px;padding:14px 0 70px}
  .q{padding:14px 13px 12px;border-radius:15px}
  .q-head{gap:9px;margin-bottom:11px}
  .qnum{min-width:28px;height:28px;font-size:13px;border-radius:9px}
  .qtext{font-size:16px;line-height:1.85}
  .qfig{margin:4px 0 11px}
  .qfig img{max-height:250px;padding:4px}
  .opts{gap:8px}
  .opt{grid-template-columns:26px 1fr 16px;gap:9px;padding:11px 11px;font-size:15px;
       line-height:1.75;border-radius:12px;align-items:flex-start}
  .opt .k{width:26px;height:26px;font-size:12.5px;border-radius:8px;margin-top:1px}

const SKEY = 'qb.session';
function saveSession(){
  if (state.view !== 'quiz' && state.view !== 'result') { try{localStorage.removeItem(SKEY)}catch(e){} return }
  store.set(SKEY, {courseId: state.course.id, mode: state.mode, quiz: state.quiz,
                   answers: state.answers, idx: state.idx, view: state.view});
}
function loadSession(){ return store.get(SKEY, null) }
function validSession(s){
  if (!s || !s.courseId || !Array.isArray(s.quiz) || !s.quiz.length) return false;
  if (!DATA.find(c=>c.id===s.courseId)) return false;
  return s.quiz.every(q => q && typeof q.q === 'string' && Array.isArray(q.opts) && q.opts.length >= 2
                           && Number.isInteger(q.ans) && q.ans >= 0 && q.ans < q.opts.length);
}
function resumeSession(){
  const s = loadSession(); if (!validSession(s)) { dropSession(); renderHome(); return; }
  state.course = DATA.find(c=>c.id===s.courseId);
  state.mode = s.mode === 'exam' ? 'exam' : 'study';
  state.quiz = s.quiz; state.answers = s.answers || {};
  state.idx = Math.min(Math.max(0, s.idx || 0), s.quiz.length - 1);
  state.view = s.view === 'result' ? 'result' : 'quiz'; render(); window.scrollTo(0,0);
}
function dropSession(){ try{localStorage.removeItem(SKEY)}catch(e){} }

/* normalise every question into {q, opts:[], ans:int, fig} */
DATA.forEach(c => c.sections.forEach(s => {
  s.items = s.questions.map(raw => {
    if (s.type === 'mcq') {
      return {q: raw.q, opts: raw.options.slice(), ans: raw.ans,
              note: raw.note || '', fig: raw.fig || null};
    }
    return {q: raw.q, opts: ['صح', 'خطأ'], ans: raw.ans ? 0 : 1,
            note: raw.note || '', fig: raw.fig || null};
  });
}));

const state = {
  view: 'home', course: null, mode: 'study', picked: [], shuffle: false,
  quiz: [], answers: {}, idx: 0, reviewed: false
};

/* ---------- sticky metrics (mobile layout follows the real bar heights) ---------- */
function syncBars(){
  const top = document.querySelector('.top'), qb = document.querySelector('.qbar');
  const r = document.documentElement.style;
  r.setProperty('--topH', (top ? top.getBoundingClientRect().height : 0) + 'px');
  r.setProperty('--qbarH', (qb ? qb.getBoundingClientRect().height : 0) + 'px');
}
window.addEventListener('resize', () => { syncBars(); });
window.addEventListener('orientationchange', () => setTimeout(syncBars, 120));
if (window.visualViewport) window.visualViewport.addEventListener('resize', syncBars);


/* ---------- theme ---------- */
const savedTheme = store.get('qb.theme', null);
if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
$('#logoIc').innerHTML = IC.logo;
$('#waIc').innerHTML = IC.wa;
$('#homeIc').innerHTML = IC.home;
function paintThemeBtn(){
  $('#themeBtn').innerHTML = document.documentElement.getAttribute('data-theme') === 'dark' ? IC.sun : IC.moon;
}
paintThemeBtn();
$('#themeBtn').onclick = () => {
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
  store.set('qb.theme', dark ? 'light' : 'dark');
  paintThemeBtn();
};
$('#homeBtn').onclick = () => goHome();

/* ---------- navigation ---------- */
function goHome(){ state.view='home'; state.course=null; render(); window.scrollTo(0,0); }
function openCourse(id){ state.view='course'; state.course = DATA.find(c=>c.id===id);
  state.picked = state.course.sections.map(s=>s.id); render(); window.scrollTo(0,0); }

/* ---------- render ---------- */
function render(){
  if (state.view === 'home') renderHome();
  else if (state.view === 'course') renderCourse();
  else if (state.view === 'quiz') renderQuiz();
  else if (state.view === 'result') renderResult();
  syncBars();
}

function totalQ(c){ return c.sections.reduce((n,s)=>n+s.items.length,0); }

function renderHome(){
  const best = store.get('qb.best', {});
  const cards = DATA.map(c => {
    const mcqN = c.sections.filter(s=>s.type==='mcq').reduce((n,s)=>n+s.items.length,0);
    const tfN = c.sections.filter(s=>s.type==='tf').reduce((n,s)=>n+s.items.length,0);
    const b = best[c.id];
    return `
    <div class="course-card" style="--c:${c.color}" onclick="openCourse('${c.id}')">
      <div class="cc-head">
        <div class="cc-emoji">${EMO[c.id] || IC.book}</div>
        <div>
          <div class="cc-title">${c.title}</div>
          <div class="cc-meta">${[`${totalQ(c)} سؤال`,
              mcqN?`${mcqN} اختيار من متعدد`:'', tfN?`${tfN} صح/خطأ`:'']
              .filter(Boolean).map(t=>`<span class="ccm">${t}</span>`).join('<span class="ccm sep">•</span>')}</div>
        </div>
      </div>
      <div class="cc-foot">
        ${b ? `<span class="badge ${b>=70?'ok':''}">أفضل نتيجة: ${b}%</span>` : `<span class="badge">لم تبدأ بعد</span>`}
        <span class="go">ابدأ الحل ←</span>
      </div>
    </div>`;
  }).join('');
  const sess = loadSession();
  const resume = validSession(sess) ? `
    <div class="setup" style="margin-bottom:22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap">
      <div style="flex:1;min-width:220px">
        <b style="font-size:15px">عندك جلسة لم تكملها</b>
        <div style="color:var(--ink-soft);font-size:13.5px;margin-top:4px">
          ${DATA.find(c=>c.id===sess.courseId)?.title || ''} — ${(()=>{
            const done = Object.keys(sess.answers||{}).length;
            return done ? `${done} من ${sess.quiz.length} سؤال` : `لسه ما جاوبتش، ${sess.quiz.length} سؤال مستنيينك`;
          })()}
        </div>
      </div>
      <button class="primary" id="resumeBtn" style="padding:12px 20px;font-size:14.5px">استكمال</button>
      <button class="ghost-btn" id="dropBtn" style="padding:12px 18px;font-size:14px">حذف</button>
    </div>` : '';
  app.innerHTML = `
  ${resume}
  <section class="hero">
    <h1>ذاكر، حُل، وصحّح إجاباتك فورًا</h1>
    <p>كل أسئلة الميد تيرم في مكان واحد: أسئلة اختيار من متعدد وصح/خطأ، بتصحيح لحظي وشرح للإجابة الصحيحة، ووضع امتحان يحسب درجتك في النهاية.</p>
    <div class="chips">
      <span class="chip">${IC.book} ${DATA.length} مقررات</span>
      <span class="chip">✓ ${DATA.reduce((n,c)=>n+totalQ(c),0)} سؤال محلول</span>
      <span class="chip">${IC.bolt} تصحيح فوري</span>
      <span class="chip">${IC.exam} وضع امتحان</span>
    </div>
  </section>
  <div class="grid">${cards}</div>`;
  if ($('#resumeBtn')) $('#resumeBtn').onclick = resumeSession;
  if ($('#dropBtn')) $('#dropBtn').onclick = () => { dropSession(); renderHome(); };
}

function renderCourse(){
  const c = state.course;
  const best = store.get('qb.best', {})[c.id];
  const nSel = state.picked.reduce((n,id)=>n + (c.sections.find(s=>s.id===id)?.items.length||0), 0);
  app.innerHTML = `
  <div style="padding-top:22px">
    <button class="icon-btn ghost" onclick="goHome()">→ كل المقررات</button>
    <h1 style="font-size:26px;margin:16px 0 4px;display:flex;align-items:center;gap:10px"><span style="color:${c.color};display:inline-flex">${EMO[c.id]||''}</span>${c.title}</h1>
    <p style="color:var(--ink-soft);margin:0 0 4px">${totalQ(c)} سؤال في ${c.sections.length} أقسام${best?` • أفضل نتيجة سابقة: <b>${best}%</b>`:''}</p>
  </div>
  <div class="setup">
    <h2>جهّز جلستك</h2>
    <div class="sub">اختر الأقسام وطريقة الحل ثم ابدأ.</div>

    <div class="label">الأقسام</div>
    <div class="seg" id="secSeg">
      ${c.sections.map(s=>`<button data-id="${s.id}" class="${state.picked.includes(s.id)?'sel':''}">${s.title} (${s.items.length})</button>`).join('')}
      <button id="allSecs" class="${state.picked.length===c.sections.length?'sel':''}">كل الأقسام</button>
    </div>

    <div class="label">طريقة الحل</div>
    <div class="modecards" id="modeCards">
      <div class="modecard ${state.mode==='study'?'sel':''}" data-mode="study">
        <div class="mi" style="color:var(--accent);display:inline-flex">${IC.bolt}</div>
        <div><b>وضع التدريب</b><span>تصحيح فوري لكل سؤال مع إظهار الإجابة الصحيحة، وتقدر تشوف الشرح لحظة الاختيار.</span></div>
      </div>
      <div class="modecard ${state.mode==='exam'?'sel':''}" data-mode="exam">
        <div class="mi" style="color:var(--accent);display:inline-flex">${IC.exam}</div>
        <div><b>وضع الامتحان</b><span>سؤال واحد في كل صفحة، بدون إظهار الإجابة، وفي النهاية تحصل على الدرجة ومراجعة الأخطاء.</span></div>
      </div>
    </div>

    <div class="label">خيارات</div>
    <label class="switch"><input type="checkbox" id="shuffleChk" ${state.shuffle?'checked':''}><span class="track"></span> ترتيب عشوائي للأسئلة</label>

    <div class="row" style="margin-top:22px">
      <button class="primary" id="startBtn" ${nSel?'':'disabled'}>ابدأ الحل (${nSel} سؤال)</button>
      ${best?`<span style="color:var(--ink-soft);font-size:13.5px">أفضل نتيجة: ${best}%</span>`:''}
    </div>
  </div>`;

  $('#secSeg').onclick = e => {
    const b = e.target.closest('button'); if(!b) return;
    if (b.id === 'allSecs'){ state.picked = c.sections.map(s=>s.id); renderCourse(); return; }
    const id = b.dataset.id;
    state.picked = state.picked.includes(id) ? state.picked.filter(x=>x!==id) : [...state.picked, id];
    renderCourse();
  };
  $('#modeCards').onclick = e => {
    const m = e.target.closest('.modecard'); if(!m) return;
    state.mode = m.dataset.mode; renderCourse();
  };
  $('#shuffleChk').onchange = e => { state.shuffle = e.target.checked; };
  $('#startBtn').onclick = () => startQuiz();
}

function shuffleArr(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]] } return a }

function buildPool(sectionIds, filterFn){
  const c = state.course;
  let pool = [];
  c.sections.filter(s=>sectionIds.includes(s.id)).forEach(s=>{
    s.items.forEach(it => pool.push({...it, sec: s.title, secType: s.type}));
  });
  if (filterFn) pool = pool.filter(filterFn);
  return state.shuffle ? shuffleArr(pool) : pool;
}

function startQuiz(pool){
  state.quiz = pool || buildPool(state.picked);
  state.answers = {}; state.idx = 0; state.view = 'quiz'; state.reviewed = false;
  render(); window.scrollTo(0,0);
}

/* ---------- quiz ---------- */
function answeredCount(){ return Object.keys(state.answers).length }
function scoreNow(){
  let ok=0, bad=0;
  state.quiz.forEach((q,i)=>{
    const a = state.answers[i]; if(a===undefined || a===-1) return;
    if(a===q.ans) ok++; else bad++;
  });
  return {ok,bad};
}

function qCard(q, i, opts={}){
  const given = state.answers[i];
  const showFeedback = state.mode==='study' && given!==undefined;
  const fig = q.fig && FIGS[q.fig]
    ? `<div class="qfig"><img src="${FIGS[q.fig]}" alt="شكل توضيحي" data-zoom="${q.fig}">`
      + `<span class="zoombar">اضغط على الشكل لعرضه بحجم أكبر</span></div>`
    : '';
  const options = q.opts.map((o,j)=>{
    let cls = 'opt';
    if (state.mode==='study' && given!==undefined){
      cls += ' locked';
      if (j===q.ans) cls += ' correct';
      else if (j===given) cls += ' wrong';
    } else if (given===j) cls += ' sel';
    const mk = (state.mode==='study' && given!==undefined) ? (j===q.ans?'✓':(j===given?'✕':'')) : '';
    return `<button class="${cls}" data-q="${i}" data-o="${j}">
      <span class="k">${q.secType==='tf' ? (j===0?'✓':'✗') : LETTERS[j]}</span>
      <span>${o}</span><span class="mark">${mk}</span>
    </button>`;
  }).join('');
  const revealed = given === -1;
  const fb = showFeedback
    ? `<div class="feedback show ${revealed ? 'ok' : (given===q.ans?'ok':'bad')}">${
        revealed ? `الإجابة الصحيحة: <b>${q.opts[q.ans]}</b>`
        : given===q.ans ? '✓ إجابة صحيحة'
        : `✕ إجابة غير صحيحة — الإجابة الصحيحة: <b>${q.opts[q.ans]}</b>`
      }${q.note?`<div style="font-weight:600;opacity:.85;margin-top:4px">${q.note}</div>`:''}</div>`
    : '';
  const extra = opts.single ? '' : `
    <div class="q-actions">
      ${state.mode==='study' && given===undefined ? `<button class="mini" data-reveal="${i}">إظهار الإجابة</button>` : ''}
      <button class="mini" data-reset="${i}">مسح الاختيار</button>
    </div>`;
  return `<article class="q" id="q${i}">
    <div class="q-head"><div class="qnum">${i+1}</div><div class="qtext">${q.q}</div></div>
    ${fig}
    <div class="opts">${options}</div>
    ${fb}${extra}
  </article>`;
}

function renderQuiz(){
  saveSession();
  const c = state.course;
  const exam = state.mode === 'exam';
  if (!state.quiz.length){
    app.innerHTML = '<div class="empty">لا توجد أسئلة في الاختيار الحالي.</div>';
    return;
  }
  const {ok,bad} = scoreNow();
  const done = answeredCount(), total = state.quiz.length;
  const pct = Math.round(done/total*100);
  const bar = `
  <div class="qbar"><div class="wrap inner">
    <button class="icon-btn ghost" id="quitBtn" title="خروج">✕<span class="lbl"> خروج</span></button>
    <div class="progress"><i style="width:${pct}%"></i></div>
    <div class="counters">
      <span class="pill">${done} / ${total}</span>
      ${exam ? '' : `<span class="pill ok">✓ ${ok}</span><span class="pill bad">✕ ${bad}</span>`}
    </div>
    <button class="primary" id="finishBtn" style="padding:10px 18px;font-size:14px">${exam?'تسليم':'النتيجة'}</button>
  </div></div>`;

  if (exam){
    const i = state.idx, q = state.quiz[i];
    const jump = state.quiz.map((_,j)=>`<button class="${state.answers[j]!==undefined?'done':''} ${j===i?'cur':''}" data-jump="${j}">${j+1}</button>`).join('');
    app.innerHTML = `${bar}
      <div class="exam-card">
        ${qCard(q,i,{single:true})}
        <div class="nav">
          <button class="ghost-btn" id="prevBtn" ${i===0?'disabled':''}>→ السابق</button>
          <span style="color:var(--ink-soft);font-size:13.5px;font-weight:700">السؤال ${i+1} من ${total}</span>
          ${i===total-1 ? `<button class="primary" id="finishBtn2">عرض النتيجة</button>`
                        : `<button class="primary" id="nextBtn">التالي ←</button>`}
        </div>
        <div class="jump">${jump}</div>
      </div>`;
    $('#prevBtn').onclick = () => { if(state.idx>0){ state.idx--; render(); } };
    if ($('#nextBtn')) $('#nextBtn').onclick = () => { state.idx++; render(); window.scrollTo(0,0); };
    if ($('#finishBtn2')) $('#finishBtn2').onclick = () => finish();
    document.querySelectorAll('[data-jump]').forEach(b=> b.onclick = () => { state.idx = +b.dataset.jump; render(); window.scrollTo(0,0); });
  } else {
    app.innerHTML = `${bar}<div class="qlist">${state.quiz.map((q,i)=>qCard(q,i)).join('')}</div>`;
  }

  $('#quitBtn').onclick = () => { openCourse(state.course.id); };
  $('#finishBtn').onclick = () => finish();
  wireZoom();

  document.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => {
      const i = +btn.dataset.q, o = +btn.dataset.o;
      if (state.mode==='study' && state.answers[i]!==undefined) return;
      state.answers[i] = o;
      if (state.mode==='study'){ renderQuiz(); keepScroll(i); }
      else { renderQuiz(); }
    };
  });
  document.querySelectorAll('[data-reveal]').forEach(b => b.onclick = () => {
    const i = +b.dataset.reveal;
    if (state.answers[i] === undefined) { state.answers[i] = -1; renderQuiz(); keepScroll(i); }
  });
  document.querySelectorAll('[data-reset]').forEach(b => b.onclick = () => {
    const i = +b.dataset.reset; delete state.answers[i]; renderQuiz(); keepScroll(i);
  });
}

function openLightbox(key){
  if (!FIGS[key]) return;
  const lb = document.createElement('div');
  lb.className = 'lightbox';
  lb.innerHTML = `<button class="lb-x" aria-label="إغلاق">✕</button><img src="${FIGS[key]}" alt="شكل">`;
  lb.onclick = () => lb.remove();
  document.body.appendChild(lb);
}
function wireZoom(){
  document.querySelectorAll('[data-zoom]').forEach(img => {
    img.onclick = e => { e.stopPropagation(); openLightbox(img.dataset.zoom); };
  });
}

function keepScroll(i){
  const el = document.getElementById('q'+i);
  if (!el) return;
  syncBars();
  const top = document.querySelector('.top'), qb = document.querySelector('.qbar');
  const off = (top ? top.getBoundingClientRect().height : 0) +
              (qb ? qb.getBoundingClientRect().height : 0) + 10;
  const y = el.getBoundingClientRect().top + window.pageYOffset - off;
  window.scrollTo({top: Math.max(0, y), behavior:'auto'});
}

/* ---------- result ---------- */
function finish(){
  state.view = 'result'; state.reviewed = true;
  const {ok,bad} = scoreNow();
  const total = state.quiz.length;
  const pct = total ? Math.round(ok/total*100) : 0;
  const best = store.get('qb.best', {});
  if (!best[state.course.id] || pct > best[state.course.id]) { best[state.course.id] = pct; store.set('qb.best', best); }
  render(); window.scrollTo(0,0);
}

function renderResult(){
  saveSession();
  const {ok,bad} = scoreNow();
  const total = state.quiz.length;
  const pct = total? Math.round(ok/total*100) : 0;
  const color = pct>=80 ? 'var(--ok)' : pct>=50 ? '#f59e0b' : 'var(--bad)';
  const msg = pct>=90 ? 'ممتاز جدًا! جاهز للميد تيرم 🎉' : pct>=75 ? 'نتيجة قوية، كمّل مراجعة الأخطاء 💪' : pct>=50 ? 'أساس جيد — راجع الأسئلة التي أخطأت فيها.' : 'محاولة أولى، ركّز على المراجعة ثم أعد المحاولة.';
  const wrong = state.quiz.map((q,i)=>({q,i,a:state.answers[i]})).filter(x=>x.a!==undefined && x.a!==x.q.ans);
  const skipped = state.quiz.filter((q,i)=>state.answers[i]===undefined || state.answers[i]===-1).length;
  const review = wrong.map(({q,i,a})=>`
    <div class="rev-item">
      <div class="rev-q">${i+1}. ${q.q}</div>
      <div class="rev-line bad"><b>إجابتك:</b> <span>${a===-1?'لم تحل السؤال':q.opts[a]}</span></div>
      <div class="rev-line ok"><b>الصحيحة:</b> <span>${q.opts[q.ans]}</span></div>
      ${q.note?`<div class="rev-line" style="color:var(--ink-soft)"><b>ملاحظة:</b> <span>${q.note}</span></div>`:''}
    </div>`).join('');
  app.innerHTML = `
  <div class="result">
    <div class="ring" style="--p:${pct};--rc:${color}"><div><b style="color:${color}">${pct}%</b><span>${ok} من ${total}</span></div></div>
    <h2 class="rtitle">${msg}</h2>
    <p class="rsub">${state.course.title}${skipped?` • ${skipped} سؤال بدون إجابة`:''}</p>
    <div class="rstats">
      <div class="rstat"><b style="color:var(--ok)">${ok}</b><span>صحيحة</span></div>
      <div class="rstat"><b style="color:var(--bad)">${bad}</b><span>خاطئة</span></div>
      <div class="rstat"><b>${total}</b><span>إجمالي</span></div>
    </div>
    <div class="actions">
      <button class="primary" id="againAll">إعادة كل الأسئلة</button>
      ${wrong.length?`<button class="ghost-btn" id="againWrong">إعادة الأخطاء فقط (${wrong.length})</button>`:''}
      <button class="ghost-btn" id="backCourse">رجوع للمقرر</button>
    </div>
    ${wrong.length?`<div class="review"><h3>مراجعة الأخطاء</h3>${review}</div>`:''}
  </div>`;
  $('#againAll').onclick = () => startQuiz(state.quiz.slice());
  if ($('#againWrong')) $('#againWrong').onclick = () => startQuiz(wrong.map(w=>w.q));
  $('#backCourse').onclick = () => openCourse(state.course.id);
}

/* ---------- keyboard ---------- */
document.addEventListener('keydown', e => {
  if (state.view !== 'quiz' || state.mode !== 'exam') return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const q = state.quiz[state.idx];
  if (!q || !q.opts) return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= q.opts.length){ state.answers[state.idx] = n-1; renderQuiz(); }
  if (e.key === 'ArrowLeft'){ if(state.idx < state.quiz.length-1){ state.idx++; renderQuiz(); window.scrollTo(0,0); } }
  if (e.key === 'ArrowRight'){ if(state.idx > 0){ state.idx--; renderQuiz(); window.scrollTo(0,0); } }
  if (e.key === 'Enter' && state.idx === state.quiz.length-1) finish();
});

render();
</script>
</body>
</html>
